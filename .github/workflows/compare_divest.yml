name: Compare Divest sources vs zip

on:
  workflow_dispatch:

concurrency:
  group: hypatia-divest-compare
  cancel-in-progress: false

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions: write-all

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Organize directories
        run: |
          mkdir -p "${{ github.workspace }}/various" "${{ github.workspace }}/reports"

      - name: Build rebuilt domain list from living sources
        shell: bash
        run: |
          ws="${{ github.workspace }}"
          cache="$ws/divest.zip"
          cmp_args=()
          [ -f "$cache" ] && cmp_args=(--compare "$cache")
          python3 "$ws/tools/build_divest_domains.py" --sources "$ws/divest-sources.txt" -o "$ws/reports/divested-rebuilt.txt" "${cmp_args[@]}"
          [ -s "$ws/reports/divested-rebuilt.txt" ] || { echo "::error::liste rebuild vide"; exit 1; }

      - name: Compare zip vs rebuilt list and write reports
        shell: bash
        run: |
          ws="${{ github.workspace }}"
          cache="$ws/divest.zip"
          rebuilt="$ws/reports/divested-rebuilt.txt"
          zipref="$ws/reports/divest-zip.txt"
          if [ ! -f "$cache" ]; then
            echo "::warning::divest.zip absent - comparaison zip impossible."
            exit 0
          fi
          rm -rf /tmp/divest-zipref && mkdir -p /tmp/divest-zipref
          unzip -o -q "$cache" -d /tmp/divest-zipref || { echo "::error::unzip failed"; exit 1; }
          # Same extraction as the main workflow (divest.zip holds an .mhtml snapshot)
          python3 - /tmp/divest-zipref "$zipref" <<'PY'
          import sys, os, re, html, email, email.policy
          src, out = sys.argv[1], sys.argv[2]
          domain = re.compile(r"^[A-Za-z0-9_]([A-Za-z0-9_-]*[A-Za-z0-9_])?(\.[A-Za-z0-9_]([A-Za-z0-9_-]*[A-Za-z0-9_])?)+$")
          best = []
          for root, _, files in os.walk(src):
              for name in files:
                  raw = open(os.path.join(root, name), "rb").read()
                  text = None
                  if name.lower().endswith((".mhtml", ".mht")) or raw[:5] == b"From:":
                      msg = email.message_from_bytes(raw, policy=email.policy.default)
                      for part in msg.walk():
                          if part.get_content_type() == "text/html":
                              text = part.get_content()
                              break
                      if text is not None:
                          m = re.search(r"<pre[^>]*>(.*?)</pre>", text, re.S | re.I)
                          text = html.unescape(m.group(1) if m else re.sub(r"<[^>]+>", "", text))
                  else:
                      text = raw.decode("utf-8", "ignore")
                  if not text:
                      continue
                  lines = set()
                  for l in text.splitlines():
                      l = l.strip().lower()
                      if l and not l.startswith("#") and not l.startswith("*.") and domain.match(l):
                          lines.add(l)
                  if len(lines) > len(best):
                      best = sorted(lines)
          if not best:
              sys.exit(1)
          open(out, "w").write("\n".join(best) + "\n")
          PY
          [ -s "$zipref" ] || { echo "::error::0 domaines extraits du zip"; exit 1; }
          sort -u "$rebuilt" > "$ws/reports/divested-rebuilt-sorted.txt"
          comm -23 "$zipref" "$ws/reports/divested-rebuilt-sorted.txt" > "$ws/reports/zip-only-domains.txt" || true
          comm -13 "$zipref" "$ws/reports/divested-rebuilt-sorted.txt" > "$ws/reports/sources-only-domains.txt" || true
          nzip=$(wc -l < "$zipref"); nreb=$(wc -l < "$ws/reports/divested-rebuilt-sorted.txt")
          nonly=$(wc -l < "$ws/reports/zip-only-domains.txt"); snonly=$(wc -l < "$ws/reports/sources-only-domains.txt")
          {
            echo "# Rapport comparatif Divest (zip vs sources vivantes)"
            echo ""
            echo "- Domaines dans divest.zip: $nzip"
            echo "- Domaines rebuild (sources vivantes): $nreb"
            echo "- **Dans le zip mais absents des sources vivantes: $nonly**"
            echo "- Dans les sources vivantes mais absents du zip: $snonly"
            echo ""
            echo "## Domaines presents dans le zip mais pas dans les autres sources ($nonly)"
            echo ""
            echo '```'
            cat "$ws/reports/zip-only-domains.txt"
            echo '```'
          } > "$ws/reports/divest-comparison-report.md"
          echo "zip=$nzip rebuilt=$nreb zip_only=$nonly sources_only=$snonly"
          echo "Rapport: reports/divest-comparison-report.md"

      # Are the zip-only domains already covered by the other domain sources of the
      # main workflow (HaGeZi, Phishing.Database, OpenPhish, phishunt, MVT, Avast,
      # Infosec, Citizen Lab, ThreatFox, URLhaus)? One file per source so the report
      # can name which source covers what. Keep tools/fetch_extra_domains.py in sync
      # with generate_stable.yml.
      - name: Fetch the other domain sources (one file per source)
        if: hashFiles('reports/zip-only-domains.txt') != ''
        continue-on-error: true
        shell: bash
        env:
          ABUSECH_KEY: ${{ secrets.ABUSECH_KEY }}
        run: |
          ws="${{ github.workspace }}"
          [ -s "$ws/reports/zip-only-domains.txt" ] || { echo "Aucun domaine zip-only: rien a verifier."; exit 0; }
          python3 "$ws/tools/fetch_extra_domains.py" "$ws/reports/extra-sources"

      - name: Build allowlist (same as the main workflow)
        if: hashFiles('reports/zip-only-domains.txt') != ''
        continue-on-error: true
        shell: bash
        env:
          TRANCO_TOP: "10000"
        run: |
          ws="${{ github.workspace }}"
          allow="$ws/reports/allowlist.txt"
          : > "$allow"
          if curl -fsSL -L --retry 2 --max-time 180 "https://tranco-list.eu/top-1m.csv.zip" -o /tmp/tranco.zip \
             && unzip -p /tmp/tranco.zip top-1m.csv > /tmp/tranco.csv; then
            head -n "$TRANCO_TOP" /tmp/tranco.csv | cut -d, -f2 | tr -d '\r' >> "$allow"
          else
            echo "::warning::Tranco download failed."
          fi
          git clone --depth 1 https://github.com/MISP/misp-warninglists.git /tmp/misp-warninglists || true
          for l in tranco10k moz-top500 common-ioc-false-positive microsoft google apple; do
            f="/tmp/misp-warninglists/lists/$l/list.json"
            if [ -f "$f" ]; then jq -r '.list[]? | strings' "$f" >> "$allow" || true; else echo "MISP list '$l' not found, skipped."; fi
          done
          echo "Allowlist: $(wc -l < "$allow") lines."

      - name: Coverage of zip-only domains by the other sources
        if: hashFiles('reports/zip-only-domains.txt') != ''
        shell: bash
        run: |
          ws="${{ github.workspace }}"
          [ -s "$ws/reports/zip-only-domains.txt" ] || exit 0
          [ -d "$ws/reports/extra-sources" ] || { echo "::error::aucune source extra recuperee"; exit 1; }
          python3 "$ws/tools/zip_only_coverage.py" \
            --zip-only "$ws/reports/zip-only-domains.txt" \
            --extras-dir "$ws/reports/extra-sources" \
            --allowlist "$ws/reports/allowlist.txt" \
            --out-dir "$ws/reports/coverage"
          cat "$ws/reports/coverage/coverage-report.md" >> "$GITHUB_STEP_SUMMARY"
          # Same report file as before, with the coverage summary in front of the long list
          { cat "$ws/reports/coverage/coverage-report.md"; echo; cat "$ws/reports/divest-comparison-report.md"; } \
            > "$ws/reports/divest-comparison-report.full.md"

      - name: Upload comparison artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: divest-comparison
          path: |
            ${{ github.workspace }}/reports/
            !${{ github.workspace }}/reports/extra-sources/
            !${{ github.workspace }}/reports/allowlist.txt
          retention-days: 30
          if-no-files-found: ignore
