{"path":"/home/user/old_workflow.yml","content":"name: Generate Stable Database\n\non:\n  workflow_dispatch:\n  schedule:\n    - cron: '0 1 */2 * *'\n\njobs:\n  generate:\n    runs-on: ubuntu-latest\n    permissions: write-all\n\n    steps:\n      - name: Checkout\n        uses: actions/checkout@v7\n\n      - name: Dependency Setup\n        run: |\n          sudo apt-get update -y\n          sudo apt install maven unzip git dos2unix pandoc -y\n\n      - name: Start ClamAV daemon clamd\n        uses: toblux/start-clamd-github-action@v0.3\n        with:\n          db_main: true\n          db_daily: true\n      \n      - name: Organize Directories & Static Sources\n        run: |\n          mkdir -p \"${{ github.workspace }}/raw/\"\n          mkdir -p \"${{ github.workspace }}/exclusions/\"\n          mkdir -p \"${{ github.workspace }}/various/\"\n          mkdir -p \"${{ github.workspace }}/domains/\"\n          mkdir -p \"${{ github.workspace }}/cache-new/\"\n          mkdir -p \"${{ github.workspace }}/abusech-cache/\"\n          : > \"${{ github.workspace }}/various/domains-extra.txt\"\n          cp ${{ github.workspace }}/static/* \"${{ github.workspace }}/raw/\"\n\n      - name: DATABASE PREPARATION - ClamAV\n        run: |\n          mkdir /tmp/mss\n          cd /tmp/mss\n          cp /var/lib/clamav/main.c*d .\n          cp /var/lib/clamav/daily.c*d .\n          sigtool -u main.c*d\n          sigtool -u daily.c*d\n          mv /tmp/mss/*.fp* \"${{ github.workspace }}/exclusions/\"\n          mv /tmp/mss/*.hsb \"${{ github.workspace }}/raw/\"\n          mv /tmp/mss/*.hdb \"${{ github.workspace }}/raw/\"\n          mv /tmp/mss/*.hdu \"${{ github.workspace }}/raw/\"\n          mv /tmp/mss/*.hsu \"${{ github.workspace }}/raw/\"\n\n      - name: DATABASE PREPARATION - ESET\n        run: |\n          git clone https://github.com/eset/malware-ioc \"${{ github.workspace }}/various/eset-sources/\"\n          processHashes() {\n            local name=$(basename $1);\n            if [ -f $1/samples.$2 ]; then\n              dos2unix $1/samples.$2\n              while IFS= read -r line\n              do\n                echo \"$line\" >> \"${{ github.workspace }}/various/eset.$2\";\n              done < \"$1/samples.$2\";\n            fi;\n          }\n          export -f processHashes;\n          find \"${{ github.workspace }}/various/eset-sources/\" -maxdepth 2 -mindepth 1 -type d -exec bash -c 'processHashes \"{}\" md5 hdb' \\;\n          find \"${{ github.workspace }}/various/eset-sources/\" -maxdepth 2 -mindepth 1 -type d -exec bash -c 'processHashes \"{}\" sha1 hsb' \\;\n          find \"${{ github.workspace }}/various/eset-sources/\" -maxdepth 2 -mindepth 1 -type d -exec bash -c 'processHashes \"{}\" sha256 hsb' \\;\n          cp \"${{ github.workspace }}/various/eset.md5\" \"${{ github.workspace }}/raw\"\n          cp \"${{ github.workspace }}/various/eset.sha1\" \"${{ github.workspace }}/raw\"\n          cp \"${{ github.workspace }}/various/eset.sha256\" \"${{ github.workspace }}/raw\"\n\n      - name: DATABASE PREPARATION - Signature-Base\n        run: |\n          wget https://raw.githubusercontent.com/Neo23x0/signature-base/refs/heads/master/iocs/hash-iocs.txt -O \"${{ github.workspace }}/raw/signature-base.loki\"\n\n      - name: DATABASE PREPARATION - ThreatView\n        run: |\n          wget \"https://threatview.io/Downloads/MD5-HASH-ALL.txt\" -O - | sed 's/MD5 of //' >> \"${{ github.workspace }}/various/threatview.md5\"\n          wget \"https://threatview.io/Downloads/SHA-HASH-FEED.txt\" -O - >> \"${{ github.workspace }}/various/threatview.sha1\"\n          sort -u -o \"${{ github.workspace }}/raw/threatview.md5\" \"${{ github.workspace }}/various/threatview.md5\"\n          sort -u -o \"${{ github.workspace }}/raw/threatview.sha1\" \"${{ github.workspace }}/various/threatview.sha1\"\n\n      # ---------------------------------------------------------\n      # Cache de secours abuse.ch (ThreatFox + MalwareBazaar).\n      # Stocké dans le cache GitHub Actions (pas dans le repo : la liste\n      # MalwareBazaar complète pèse des dizaines de Mo une fois compressée).\n      # Chaque run réussi enregistre une nouvelle entrée ; au run suivant on\n      # restaure la plus récente (restore-keys). Les entrées non utilisées\n      # pendant 7 jours sont purgées par GitHub : avec un run tous les 2 jours,\n      # le cache reste toujours vivant.\n      # ---------------------------------------------------------\n      - name: Restore abuse.ch fallback cache\n        uses: actions/cache/restore@v6\n        with:\n          path: ${{ github.workspace }}/abusech-cache\n          key: abusech-${{ github.run_id }}\n          restore-keys: |\n            abusech-\n\n      # abuse.ch now requires a free Auth-Key (https://auth.abuse.ch).\n      # Add it in: Settings > Secrets and variables > Actions > New secret\n      # Name: ABUSECH_KEY\n      # Téléchargement : HTTP/1.1 forcé (évite \"HTTP/2 stream ... INTERNAL_ERROR\"),\n      # 3 tentatives, contrôle de taille minimale, sinon repli sur le cache.\n      - name: DATABASE PREPARATION - ThreatFox\n        continue-on-error: true\n        shell: bash\n        env:\n          ABUSECH_KEY: ${{ secrets.ABUSECH_KEY }}\n          TF_MIN_LINES: \"1000\"\n        run: |\n          ws=\"${{ github.workspace }}\"\n          cdir=\"$ws/abusech-cache\"\n          cfile=\"$cdir/threatfox.sha256.gz\"\n          out=\"$ws/raw/threatfox.sha256\"\n          dl=\"$ws/various/download_threatfox.zip\"\n          mkdir -p \"$ws/various/threatfox\" \"$cdir\"\n          fresh=0\n\n          if [ -z \"$ABUSECH_KEY\" ]; then\n            echo \"::warning::ABUSECH_KEY secret not set - cannot download ThreatFox.\"\n          else\n            for attempt in 1 2 3; do\n              rm -f \"$dl\"; rm -rf \"$ws/various/threatfox\"/*\n              if curl -fsSL --http1.1 --retry 3 --retry-delay 10 --retry-all-errors --max-time 600 \\\n                   \"https://threatfox-api.abuse.ch/v2/files/exports/${ABUSECH_KEY}/full.csv.zip\" -o \"$dl\" \\\n                 && unzip -tq \"$dl\" >/dev/null 2>&1 \\\n                 && unzip -o -q \"$dl\" -d \"$ws/various/threatfox/\"; then\n                cat \"$ws\"/various/threatfox/*.csv \\\n                  | grep sha256_hash \\\n                  | grep -oE '\\b[a-fA-F0-9]{64}\\b' \\\n                  | tr '[:upper:]' '[:lower:]' | sort -u \\\n                  > \"$out.tmp\" || true\n                n=$(wc -l < \"$out.tmp\")\n                if [ \"$n\" -ge \"$TF_MIN_LINES\" ]; then\n                  mv \"$out.tmp\" \"$out\"; fresh=1; break\n                fi\n                echo \"::warning::ThreatFox attempt $attempt: only $n hashes (expected >= $TF_MIN_LINES).\"\n              else\n                echo \"::warning::ThreatFox download attempt $attempt failed.\"\n              fi\n              rm -f \"$out.tmp\"\n              sleep $((attempt * 20))\n            done\n          fi\n\n          if [ \"$fresh\" = 1 ]; then\n            gzip -c \"$out\" > \"$cfile\"\n            echo \"ABUSECH_CACHE_UPDATED=1\" >> \"$GITHUB_ENV\"\n            echo \"ThreatFox: $(wc -l < \"$out\") sha256 signatures (fresh download, cache refreshed).\"\n          elif [ -s \"$cfile\" ]; then\n            gunzip -c \"$cfile\" > \"$out\"\n            echo \"::warning::ThreatFox download failed - using cached copy from $(date -u -r \"$cfile\" +%Y-%m-%d).\"\n            echo \"ThreatFox: $(wc -l < \"$out\") sha256 signatures (from cache).\"\n          else\n            echo \"::warning::ThreatFox download failed and no cache available - skipping.\"\n          fi\n\n      # MalwareBazaar exports need the Auth-Key. full.csv.zip = complete dump\n      # (~1.1M sha256); recent.csv = only the last 48h (a few thousand).\n      # Si tu passes MB_EXPORT_FILE à recent.csv, baisse MB_MIN_LINES (ex. 500).\n      - name: DATABASE PREPARATION - MalwareBazaar\n        continue-on-error: true\n        shell: bash\n        env:\n          ABUSECH_KEY: ${{ secrets.ABUSECH_KEY }}\n          MB_EXPORT_FILE: full.csv.zip\n          MB_MIN_LINES: \"100000\"\n        run: |\n          ws=\"${{ github.workspace }}\"\n          cdir=\"$ws/abusech-cache\"\n          cfile=\"$cdir/malware_bazaar.sha256.gz\"\n          out=\"$ws/raw/malware_bazaar.sha256\"\n          dl=\"$ws/various/bazaar_download\"\n          mkdir -p \"$ws/various/bazaar\" \"$cdir\"\n          fresh=0\n\n          if [ -z \"$ABUSECH_KEY\" ]; then\n            echo \"::warning::ABUSECH_KEY secret not set - cannot download MalwareBazaar.\"\n          else\n            for attempt in 1 2 3; do\n              rm -f \"$dl\"; rm -rf \"$ws/various/bazaar\"/*\n              if curl -fsSL --http1.1 --retry 3 --retry-delay 10 --retry-all-errors --max-time 900 \\\n                   \"https://mb-api.abuse.ch/v2/files/exports/${ABUSECH_KEY}/${MB_EXPORT_FILE}\" -o \"$dl\"; then\n                if unzip -tq \"$dl\" >/dev/null 2>&1; then\n                  unzip -o -q \"$dl\" -d \"$ws/various/bazaar/\"\n                else\n                  cp \"$dl\" \"$ws/various/bazaar/export.txt\"\n                fi\n                cat \"$ws\"/various/bazaar/* \\\n                  | grep -oE '\\b[a-fA-F0-9]{64}\\b' \\\n                  | tr '[:upper:]' '[:lower:]' | sort -u \\\n                  > \"$out.tmp\" || true\n                n=$(wc -l < \"$out.tmp\")\n                if [ \"$n\" -ge \"$MB_MIN_LINES\" ]; then\n                  mv \"$out.tmp\" \"$out\"; fresh=1; break\n                fi\n                echo \"::warning::MalwareBazaar attempt $attempt: only $n hashes (expected >= $MB_MIN_LINES).\"\n              else\n                echo \"::warning::MalwareBazaar download attempt $attempt failed.\"\n              fi\n              rm -f \"$out.tmp\"\n              sleep $((attempt * 20))\n            done\n          fi\n\n          if [ \"$fresh\" = 1 ]; then\n            gzip -c \"$out\" > \"$cfile\"\n            echo \"ABUSECH_CACHE_UPDATED=1\" >> \"$GITHUB_ENV\"\n            echo \"MalwareBazaar: $(wc -l < \"$out\") sha256 signatures (fresh download, cache refreshed).\"\n          elif [ -s \"$cfile\" ]; then\n            gunzip -c \"$cfile\" > \"$out\"\n            echo \"::warning::MalwareBazaar download failed - using cached copy from $(date -u -r \"$cfile\" +%Y-%m-%d).\"\n            echo \"MalwareBazaar: $(wc -l < \"$out\") sha256 signatures (from cache).\"\n          else\n            echo \"::warning::MalwareBazaar download failed and no cache available - skipping.\"\n          fi\n\n      # Enregistre le cache uniquement si au moins un téléchargement a réussi\n      - name: Save abuse.ch fallback cache\n        if: env.ABUSECH_CACHE_UPDATED == '1'\n        uses: actions/cache/save@v6\n        with:\n          path: ${{ github.workspace }}/abusech-cache\n          key: abusech-${{ github.run_id }}\n\n      - name: DATABASE PREPARATION - Stalkerware\n        run: |\n          wget \"https://raw.githubusercontent.com/AssoEchap/stalkerware-indicators/refs/heads/master/samples.csv\" -O \"${{ github.workspace }}/various/stalkerware.csv\"\n          while IFS=, read -r col1SHA col2Package col3Certificate col4Version col5Name\n          do\n            if [ -n \"$col1SHA\" ] && [ -n \"$col5Name\" ]; then\n              echo \"$col1SHA:0:$col5Name\" >> \"${{ github.workspace }}/raw/stalkerware.hsb\";\n            fi;\n          done < \"${{ github.workspace }}/various/stalkerware.csv\";\n          sed -i '1d' \"${{ github.workspace }}/raw/stalkerware.hsb\";\n\n      - name: DATABASE PREPARATION - Sanesecurity\n        run: |\n          mkdir -p \"${{ github.workspace }}/various/sanesecurity-real/\"\n          cd \"${{ github.workspace }}/various/sanesecurity-real/\"\n          rsync -av rsync://rsync.sanesecurity.net/sanesecurity .\n          for f in *.hsb; do\n            echo \"\" >> \"${{ github.workspace }}/raw/sanesecurity-$f\";\n            cat \"$f\" >> \"${{ github.workspace }}/raw/sanesecurity-$f\";\n            sort -u -o \"${{ github.workspace }}/raw/sanesecurity-$f\" \"${{ github.workspace }}/raw/sanesecurity-$f\";\n          done\n          for f in *.hdb; do\n            echo \"\" >> \"${{ github.workspace }}/raw/sanesecurity-$f\";\n            cat \"$f\" >> \"${{ github.workspace }}/raw/sanesecurity-$f\";\n            sort -u -o \"${{ github.workspace }}/raw/sanesecurity-$f\" \"${{ github.workspace }}/raw/sanesecurity-$f\";\n          done\n          rm -v ${{ github.workspace }}/raw/sanesecurity-crdfam.clamav.hdb ${{ github.workspace }}/raw/sanesecurity-doppelstern.hdb ${{ github.workspace }}/raw/sanesecurity-malware.expert.hdb\n\n      - name: DATABASE PREPARATION - Avast Covid-19 IOC\n        run: |\n          cd \"${{ github.workspace }}/various\"\n          git clone https://github.com/avast/covid-19-ioc.git\n          cd \"covid-19-ioc/datasets/android\"\n          tail -n +2 *.csv | sed 's/,/ , /' | awk '{ print $1 }' | sort -u  >> \"${{ github.workspace }}/raw/avast-covid19.sha256\"\n\n      - name: DATABASE PREPARATION - Targeted Threats\n        run: |\n          cd \"${{ github.workspace }}/various\"\n          git clone https://github.com/botherder/targetedthreats.git\n          cd targetedthreats\n          while IFS=, read -r col1MD5 col2SHA256 col3Family col4Actor col5Country col6Report\n          do\n            col4Actor=$(sed -e 's/^\"//' -e 's/\"$//' <<< \"$col4Actor\");\n            col3Family=$(sed -e 's/^\"//' -e 's/\"$//' <<< \"$col3Family\");\n            if [ -n \"$col4Actor\" ] && [ -n \"$col3Family\" ]; then\n              description=\"$col4Actor-$col3Family\";\n            elif [ -n \"$col4Actor\" ] && [ -z \"$col3Family\" ]; then\n              description=\"$col4Actor\";\n            elif [ -z \"$col4Actor\" ] && [ -n \"$col3Family\" ]; then\n              description=\"$col3Family\";\n            fi;\n            if [ -z \"$description\" ]; then\n              description=\"targetedthreats\";\n            fi;\n            col1MD5=$(sed -e 's/^\"//' -e 's/\"$//' <<< \"$col1MD5\");\n            if [ -n \"$col1MD5\" ]; then\n              echo \"$col1MD5:0:$description\" >> ${{ github.workspace }}/raw/targetedthreats.hdb;\n            fi;\n            col2SHA256=$(sed -e 's/^\"//' -e 's/\"$//' <<< \"$col2SHA256\");\n            if [ -n \"$col2SHA256\" ]; then\n              echo \"$col2SHA256:0:$description\" >> ${{ github.workspace }}/raw/targetedthreats.hsb;\n            fi;\n          done < samples.csv;\n          sed -i '1d' ${{ github.workspace }}/raw/targetedthreats.hdb;\n          sed -i '1d' ${{ github.workspace }}/raw/targetedthreats.hsb;\n\n      - name: DATABASE PREPARATION - Divest Domains (best effort, cache fallback)\n        shell: bash\n        continue-on-error: true\n        run: |\n          output=\"${{ github.workspace }}/domains/divested.txt\"\n          cache=\"${{ github.workspace }}/divest.zip\"\n          UA=\"Mozilla/5.0 (X11; Linux x86_64; rv:128.0) Gecko/20100101 Firefox/128.0\"\n          headers=(-H \"User-Agent: $UA\"\n                   -H \"Accept: text/plain,text/html,application/xhtml+xml;q=0.9,*/*;q=0.8\"\n                   -H \"Accept-Language: en-US,en;q=0.5\"\n                   -H \"Accept-Encoding: identity\")\n          observed=\"\"\n\n          try_fetch() {\n            local url=\"$1\" dest=\"$2\" code\n            code=$(curl -sS -L -o \"$dest\" -w \"%{http_code}\" --max-time 120 \\\n              --retry 2 --retry-all-errors \"${headers[@]}\" \"$url\" 2>&1) || true\n            observed=\"${observed}[${url} => ${code}] \"\n            [ -s \"$dest\" ] || return 1\n            head -c 200 \"$dest\" | grep -qi \"<!DOCTYPE\\|<html\" && return 1\n            return 0\n          }\n\n          ok=0\n          if try_fetch \"https://divested.dev/hosts-domains\" \"$output\"; then\n            ok=1; echo \"Downloaded fresh Divest domains list.\"\n            # Fresh download succeeded: also refresh the divest.zip cache\n            # in the repo so the fallback stays current.\n            rm -rf /tmp/divest-refresh && mkdir -p /tmp/divest-refresh\n            cp \"$output\" /tmp/divest-refresh/divested.txt\n            (cd /tmp/divest-refresh && zip -q -r divest.zip divested.txt)\n            mkdir -p \"${{ github.workspace }}/cache-new\"\n            cp /tmp/divest-refresh/divest.zip \"${{ github.workspace }}/cache-new/divest.zip\"\n            echo \"DIVEST_CACHE_UPDATED=1\" >> \"$GITHUB_ENV\"\n          elif try_fetch \"https://divested.dev/hosts-domains-wildcards\" /tmp/divest-wc.txt; then\n            grep -Ev \"^[[:space:]]*(#|$|\\*\\.)\" /tmp/divest-wc.txt > \"$output\" || true\n            if [ -s \"$output\" ]; then ok=1; echo \"::warning::Primary endpoint failed; used wildcards list.\"; fi\n          elif try_fetch \"https://divested.dev/hosts\" /tmp/divest-hosts.txt; then\n            awk '($1==\"0.0.0.0\" || $1==\"127.0.0.1\") && $2 !~ /^#/ {print $2}' /tmp/divest-hosts.txt | sort -u > \"$output\" || true\n            if [ -s \"$output\" ]; then ok=1; echo \"::warning::Domain endpoints failed; extracted domains from hosts list.\"; fi\n          fi\n\n          if [ \"$ok\" != 1 ] && [ -f \"$cache\" ]; then\n            rm -rf /tmp/divest-cache && mkdir -p /tmp/divest-cache\n            if unzip -o -q \"$cache\" -d /tmp/divest-cache; then\n              # divest.zip contains a browser snapshot (.mhtml): decode MIME, extract the <pre> block\n              python3 - /tmp/divest-cache \"$output\" <<'PY' && ok=1\n          import sys, os, re, html, email, email.policy\n          src, out = sys.argv[1], sys.argv[2]\n          domain = re.compile(r\"^[A-Za-z0-9_]([A-Za-z0-9_-]*[A-Za-z0-9_])?(\\.[A-Za-z0-9_]([A-Za-z0-9_-]*[A-Za-z0-9_])?)+$\")\n          best = []\n          for root, _, files in os.walk(src):\n              for name in files:\n                  raw = open(os.path.join(root, name), \"rb\").read()\n                  text = None\n                  if name.lower().endswith((\".mhtml\", \".mht\")) or raw[:5] == b\"From:\":\n                      msg = email.message_from_bytes(raw, policy=email.policy.default)\n                      for part in msg.walk():\n                          if part.get_content_type() == \"text/html\":\n                              text = part.get_content()\n                              break\n                      if text is not None:\n                          m = re.search(r\"<pre[^>]*>(.*?)</pre>\", text, re.S | re.I)\n                          text = html.unescape(m.group(1) if m else re.sub(r\"<[^>]+>\", \"\", text))\n                  else:\n                      text = raw.decode(\"utf-8\", \"ignore\")\n                  if not text:\n                      continue\n                  lines = set()\n                  for l in text.splitlines():\n                      l = l.strip().lower()\n                      if l and not l.startswith(\"#\") and not l.startswith(\"*.\") and domain.match(l):\n                          lines.add(l)\n                  if len(lines) > len(best):\n                      best = sorted(lines)\n          if not best:\n              sys.exit(1)\n          open(out, \"w\").write(\"\\n\".join(best) + \"\\n\")\n          PY\n              if [ \"$ok\" = 1 ]; then\n                echo \"::warning::divested.dev unreachable (${observed}) — using cached divest.zip (updated $(date -u -r \"$cache\" +\"%Y-%m-%d\")).\"\n              fi\n            fi\n          fi\n\n          if [ \"$ok\" != 1 ]; then\n            echo \"::warning::All divested.dev endpoints failed and no usable cache — continuing without this source. HTTP results: ${observed}\"\n            : > \"$output\"\n          fi\n          echo \"Divest domains file: $(wc -l < \"$output\") lines.\"\n\n      - name: DATABASE PREPARATION - Zimperium IOC\n        continue-on-error: true\n        run: |\n          git clone --depth 1 https://github.com/Zimperium/IOC.git \"${{ github.workspace }}/various/zimperium/\"\n          find \"${{ github.workspace }}/various/zimperium/\" -name \"apks.csv\" -exec cat {} + |\n            grep -E '^[a-fA-F0-9]{64}$' | sort -u > \"${{ github.workspace }}/raw/zimperium.sha256\"\n          echo \"Zimperium: $(wc -l < \"${{ github.workspace }}/raw/zimperium.sha256\") sha256 signatures.\"\n\n      - name: DATABASE PREPARATION - MVT Indicators\n        continue-on-error: true\n        run: |\n          git clone --depth 1 https://github.com/mvt-project/mvt-indicators.git \"${{ github.workspace }}/various/mvt/\"\n          find \"${{ github.workspace }}/various/mvt/\" -name \"sha256.txt\" -exec cat {} + |\n            grep -E '^[a-fA-F0-9]{64}$' | sort -u > \"${{ github.workspace }}/raw/mvt.sha256\"\n          find \"${{ github.workspace }}/various/mvt/\" -name \"domains.txt\" -exec cat {} + |\n            sort -u >> \"${{ github.workspace }}/various/domains-extra.txt\"\n          echo \"MVT: $(wc -l < \"${{ github.workspace }}/raw/mvt.sha256\") sha256 signatures, domains appended.\"\n\n      - name: DATABASE PREPARATION - Amnesty Investigations\n        continue-on-error: true\n        run: |\n          git clone --depth 1 https://github.com/amnestytech/investigations.git \"${{ github.workspace }}/various/amnesty/\"\n          grep -rhoE '^[a-fA-F0-9]{64}$' \"${{ github.workspace }}/various/amnesty/\" |\n            sort -u > \"${{ github.workspace }}/raw/amnesty.sha256\"\n          echo \"Amnesty: $(wc -l < \"${{ github.workspace }}/raw/amnesty.sha256\") sha256 signatures.\"\n\n      # https://github.com/MaintainTeam/HypatiaDatabases/issues/20\n      # avast/ioc (Gen Threat Labs, DRL 1.1): hashes from samples.* files +\n      # domains from defanged text files (hxxps://, domain[.]tld).\n      - name: DATABASE PREPARATION - Avast IOC\n        continue-on-error: true\n        run: |\n          git clone --depth 1 https://github.com/avast/ioc \"${{ github.workspace }}/various/avast-ioc/\"\n          avastdir=\"${{ github.workspace }}/various/avast-ioc\"\n          # --- hashes ---\n          # awk guarantees one hash per line even if source files lack trailing newlines\n          find \"$avastdir\" -type f -name \"samples.md5\" -exec awk 1 {} + > \"${{ github.workspace }}/various/avast.md5\" || true\n          find \"$avastdir\" -type f -name \"samples.sha1\" -exec awk 1 {} + > \"${{ github.workspace }}/various/avast.sha1\" || true\n          find \"$avastdir\" -type f -name \"samples.sha256\" -exec awk 1 {} + > \"${{ github.workspace }}/various/avast.sha256\" || true\n          for h in md5 sha1 sha256; do\n            if [ -s \"${{ github.workspace }}/various/avast.$h\" ]; then\n              sort -u -o \"${{ github.workspace }}/raw/avast.$h\" \"${{ github.workspace }}/various/avast.$h\"\n            fi\n          done\n          # --- domains: defang (hxxp -> http, [.] -> .) then extract hostnames ---\n          find \"$avastdir\" -type f -name \"*.txt\" -exec cat {} + > \"${{ github.workspace }}/various/avast-all.txt\" 2>/dev/null || true\n          if [ -s \"${{ github.workspace }}/various/avast-all.txt\" ]; then\n            sed -e \"s/hxxps/http/g\" -e \"s/hxxp/http/g\" -e \"s/\\[:\\]/:/g\" -e \"s/\\[\\.\\]/./g\" -e \"s/\\[,\\]/,/g\" \\\n              \"${{ github.workspace }}/various/avast-all.txt\" \\\n              | grep -oE \"([a-zA-Z0-9]([a-zA-Z0-9-]*[a-zA-Z0-9])?\\.)+[a-zA-Z]{2,}\" \\\n              | tr \"[:upper:]\" \"[:lower:]\" | sort -u \\\n              >> \"${{ github.workspace }}/various/domains-extra.txt\" || true\n            echo \"Avast IOC: domains extracted from $(wc -l < \"${{ github.workspace }}/various/avast-all.txt\") lines.\"\n          fi\n      # abuse.ch URLhaus: the old public downloads (hostfile, csv_recent) now answer 401.\n      # New export API: https://urlhaus-api.abuse.ch/v2/files/exports/<AUTH-KEY>/<file>\n      # (same pattern as ThreatFox / MalwareBazaar). Needs the ABUSECH_KEY secret.\n      # recent.csv is used by default; if you see the exact name of the hostfile export\n      # when logged in on https://urlhaus.abuse.ch/api/, set URLHAUS_EXPORT_FILE to it\n      # (both CSV and hosts formats are parsed). Output: various/domains-extra.txt.\n      - name: DATABASE PREPARATION - URLhaus (export API)\n        continue-on-error: true\n        shell: bash\n        env:\n          ABUSECH_KEY: ${{ secrets.ABUSECH_KEY }}\n          URLHAUS_EXPORT_FILE: recent.csv\n          URLHAUS_ONLY_ONLINE: \"1\"\n        run: |\n          ws=\"${{ github.workspace }}\"\n          if [ -z \"$ABUSECH_KEY\" ]; then\n            echo \"::warning::ABUSECH_KEY secret not set - skipping URLhaus.\"\n            exit 0\n          fi\n          dl=\"$ws/various/urlhaus-export.txt\"\n          code=$(curl -sS -L --http1.1 --retry 3 --retry-all-errors --max-time 180 -H \"Auth-Key: ${ABUSECH_KEY}\" \\\n            -o \"$dl\" -w \"%{http_code}\" \"https://urlhaus-api.abuse.ch/v2/files/exports/${ABUSECH_KEY}/${URLHAUS_EXPORT_FILE}\") || true\n          if [ \"$code\" != \"200\" ] || [ ! -s \"$dl\" ] || head -c 200 \"$dl\" | grep -qi \"<!DOCTYPE\\|<html\"; then\n            echo \"::warning::URLhaus export failed (HTTP $code) - skipping.\"\n            exit 0\n          fi\n          if unzip -tq \"$dl\" >/dev/null 2>&1; then unzip -p \"$dl\" > \"$dl.txt\" && mv \"$dl.txt\" \"$dl\"; fi\n          python3 - \"$dl\" \"$ws/various/urlhaus-hosts.txt\" \"${URLHAUS_ONLY_ONLINE}\" <<'PY'\n          import csv, re, sys\n          from urllib.parse import urlparse\n          src, out, only_online = sys.argv[1], sys.argv[2], sys.argv[3] == \"1\"\n          ip = re.compile(r\"^\\d{1,3}(\\.\\d{1,3}){3}$\")\n          hosts = set()\n          for line in open(src, errors=\"ignore\"):\n              line = line.strip()\n              if not line or line.startswith(\"#\"):\n                  continue\n              fields = next(csv.reader([line]), [])\n              url = next((f for f in fields if re.match(r\"^https?://\", f, re.I)), None)\n              if url:\n                  status = next((f.lower() for f in fields if f.lower() in (\"online\", \"offline\")), \"\")\n                  if only_online and status == \"offline\":\n                      continue\n                  h = (urlparse(url).hostname or \"\").lower()\n              else:  # hosts format: \"127.0.0.1<TAB>domain\"\n                  parts = line.split()\n                  h = parts[1].lower() if len(parts) >= 2 and ip.match(parts[0]) else \"\"\n              if h and not ip.match(h) and \".\" in h:\n                  hosts.add(h)\n          open(out, \"w\").write(\"\\n\".join(sorted(hosts)) + (\"\\n\" if hosts else \"\"))\n          print(f\"URLhaus: {len(hosts)} unique hostnames (IPs excluded).\")\n          PY\n          if [ -s \"$ws/various/urlhaus-hosts.txt\" ]; then\n            cat \"$ws/various/urlhaus-hosts.txt\" >> \"$ws/various/domains-extra.txt\"\n          fi\n\n      # GithubInfosec/latest-malware-IoC: SOC-curated IOCs from recent\n      # threat research (~36 campaigns: APT41, DarkGate, Medusa, ...).\n      # Hashes and domains are embedded in Markdown tables/text files.\n      - name: DATABASE PREPARATION - GithubInfosec IOC\n        continue-on-error: true\n        run: |\n          git clone --depth 1 https://github.com/GithubInfosec/latest-malware-IoC \"${{ github.workspace }}/various/infosec-ioc/\"\n          infodir=\"${{ github.workspace }}/various/infosec-ioc\"\n          allmd=\"${{ github.workspace }}/various/infosec-all.md\"\n          # Concatenate every Markdown IOC file (tables + text)\n          find \"$infodir\" -type f -name \"*.md\" -not -name \"README.md\" -exec cat {} + > \"$allmd\" 2>/dev/null || true\n          if [ -s \"$allmd\" ]; then\n            # --- hashes: plain hex strings of valid length ---\n            : > \"${{ github.workspace }}/various/infosec.md5\"; : > \"${{ github.workspace }}/various/infosec.sha1\"; : > \"${{ github.workspace }}/various/infosec.sha256\"\n            grep -oE \"\\b[a-fA-F0-9]{32}\\b\" \"$allmd\" | tr \"[:upper:]\" \"[:lower:]\" | sort -u > \"${{ github.workspace }}/various/infosec.md5\" || true\n            grep -oE \"\\b[a-fA-F0-9]{40}\\b\" \"$allmd\" | tr \"[:upper:]\" \"[:lower:]\" | sort -u > \"${{ github.workspace }}/various/infosec.sha1\" || true\n            grep -oE \"\\b[a-fA-F0-9]{64}\\b\" \"$allmd\" | tr \"[:upper:]\" \"[:lower:]\" | sort -u > \"${{ github.workspace }}/various/infosec.sha256\" || true\n            for h in md5 sha1 sha256; do\n              if [ -s \"${{ github.workspace }}/various/infosec.$h\" ]; then\n                cp \"${{ github.workspace }}/various/infosec.$h\" \"${{ github.workspace }}/raw/infosec.$h\"\n              fi\n            done\n            # --- domains: defang + extract, excluding file extensions ---\n            sed -e \"s/hxxps/http/g\" -e \"s/hxxp/http/g\" -e \"s/\\[\\.\\]/./g\" -e \"s/\\[:\\]/:/g\" \"$allmd\" \\\n              | grep -oE \"([a-zA-Z0-9]([a-zA-Z0-9-]*[a-zA-Z0-9])?\\.)+[a-zA-Z]{2,}\" \\\n              | grep -vE \"\\.(dll|exe|tmp|pdf|bin|dat|jpg|png|gif|zip|rar|7z|ps1|bat|vbs|js|hta|jar|txt|md|csv|xls|xlsx|doc|docx|ppt|pptx|msi|scr|pif|lnk|iso|img|cab|sys)$\" \\\n              | tr \"[:upper:]\" \"[:lower:]\" | sort -u \\\n              >> \"${{ github.workspace }}/various/domains-extra.txt\" || true\n            echo \"GithubInfosec: md5 $(wc -l < \"${{ github.workspace }}/various/infosec.md5\"), sha1 $(wc -l < \"${{ github.workspace }}/various/infosec.sha1\"), sha256 $(wc -l < \"${{ github.workspace }}/various/infosec.sha256\") hashes.\"\n          fi\n      # Citizen Lab malware-indicators (spyware campaigns). Licence: CC BY-NC-SA 4.0\n      # (non-commercial, share-alike) - check it fits your distribution.\n      - name: DATABASE PREPARATION - Citizen Lab\n        continue-on-error: true\n        shell: bash\n        run: |\n          ws=\"${{ github.workspace }}\"\n          git clone --depth 1 https://github.com/citizenlab/malware-indicators.git \"$ws/various/citizenlab/\"\n          python3 - \"$ws/various/citizenlab\" \"$ws\" <<'PY'\n          import csv, os, re, sys\n          from urllib.parse import urlparse\n          src, ws = sys.argv[1], sys.argv[2]\n          hexrx = {n: re.compile(r\"(?<![0-9a-fA-F])[0-9a-fA-F]{%d}(?![0-9a-fA-F])\" % n) for n in (32, 40, 64)}\n          ip = re.compile(r\"^\\d{1,3}(\\.\\d{1,3}){3}$\")\n          dom = re.compile(r\"^(?=.{1,253}$)([a-z0-9_]([a-z0-9_-]{0,61}[a-z0-9_])?\\.)+[a-z][a-z0-9-]{1,62}$\")\n          hashes = {32: set(), 40: set(), 64: set()}\n          domains = set()\n          rows = 0\n          for root, _, files in os.walk(src):\n              for name in files:\n                  if not name.lower().endswith(\".csv\"):\n                      continue\n                  with open(os.path.join(root, name), newline=\"\", encoding=\"utf-8\", errors=\"ignore\") as fh:\n                      for row in csv.DictReader(fh):\n                          r = {k.strip().lower(): (v or \"\").strip() for k, v in row.items() if k is not None and isinstance(v, (str, type(None)))}\n                          typ, val = r.get(\"type\", \"\").lower(), r.get(\"value\", \"\")\n                          if not val:\n                              continue\n                          rows += 1\n                          for n, rx in hexrx.items():\n                              for m in rx.findall(val):\n                                  hashes[n].add(m.lower())\n                          host = \"\"\n                          if typ in (\"domain\", \"hostname\") or typ.startswith((\"domain|\", \"hostname|\")):\n                              host = val.split(\"|\")[0]\n                          elif typ == \"url\":\n                              host = urlparse(val if \"://\" in val else \"http://\" + val).hostname or \"\"\n                          host = host.lower().strip(\".\")\n                          if host and not ip.match(host) and dom.match(host):\n                              domains.add(host)\n          for n, ext in ((32, \"md5\"), (40, \"sha1\"), (64, \"sha256\")):\n              if hashes[n]:\n                  open(f\"{ws}/raw/citizenlab.{ext}\", \"w\").write(\"\\n\".join(sorted(hashes[n])) + \"\\n\")\n          with open(f\"{ws}/various/domains-extra.txt\", \"a\") as f:\n              f.write(\"\\n\".join(sorted(domains)) + (\"\\n\" if domains else \"\"))\n          print(f\"Citizen Lab: {rows} rows, md5 {len(hashes[32])}, sha1 {len(hashes[40])}, sha256 {len(hashes[64])}, domains {len(domains)}\")\n          if rows == 0:\n              print(\"::warning::Citizen Lab: no rows parsed (CSV columns 'type'/'value' not found?) - check the repo layout.\")\n          PY\n\n      # Zscaler ThreatLabz IOCs (MIT). Hashes only: the files are free-form,\n      # domains would be too noisy. Note: the repo has been quiet since 2024.\n      - name: DATABASE PREPARATION - Zscaler ThreatLabz\n        continue-on-error: true\n        shell: bash\n        run: |\n          ws=\"${{ github.workspace }}\"\n          git clone --depth 1 https://github.com/threatlabz/iocs.git \"$ws/various/threatlabz/\"\n          find \"$ws/various/threatlabz/\" -type f -not -path '*/.git/*' -not -iname '*.yar' -not -iname '*.yara' -not -iname 'LICENSE*' \\\n            -exec awk 1 {} + > \"$ws/various/threatlabz-all.txt\" 2>/dev/null || true\n          for spec in \"md5 32\" \"sha1 40\" \"sha256 64\"; do\n            set -- $spec\n            grep -aoE \"\\b[a-fA-F0-9]{$2}\\b\" \"$ws/various/threatlabz-all.txt\" | tr \"[:upper:]\" \"[:lower:]\" | sort -u > \"$ws/various/threatlabz.$1\" || true\n            [ -s \"$ws/various/threatlabz.$1\" ] && cp \"$ws/various/threatlabz.$1\" \"$ws/raw/threatlabz.$1\"\n          done\n          echo \"ThreatLabz: md5 $(wc -l < \"$ws/various/threatlabz.md5\"), sha1 $(wc -l < \"$ws/various/threatlabz.sha1\"), sha256 $(wc -l < \"$ws/various/threatlabz.sha256\").\"\n\n      # HaGeZi Threat Intelligence Feeds (domains). Check the licence of the repo.\n      - name: DATABASE PREPARATION - HaGeZi TIF\n        continue-on-error: true\n        shell: bash\n        run: |\n          ws=\"${{ github.workspace }}\"\n          dest=\"$ws/various/hagezi-tif.txt\"\n          ok=0\n          for url in \\\n            \"https://raw.githubusercontent.com/hagezi/dns-blocklists/main/domains/tif.txt\" \\\n            \"https://raw.githubusercontent.com/hagezi/dns-blocklists/main/wildcard/tif-onlydomains.txt\"; do\n            if curl -fsSL --retry 2 --max-time 180 \"$url\" -o \"$dest\" && [ -s \"$dest\" ] && ! head -c 200 \"$dest\" | grep -qi \"<!DOCTYPE\\|<html\"; then\n              ok=1; echo \"HaGeZi TIF fetched from $url\"; break\n            fi\n          done\n          if [ \"$ok\" != 1 ]; then echo \"::warning::HaGeZi TIF unavailable - skipping.\"; exit 0; fi\n          tr -d '\\r' < \"$dest\" | grep -Ev '^[[:space:]]*(#|!|$)' | sed 's/^\\*\\.//' | tr '[:upper:]' '[:lower:]' \\\n            >> \"$ws/various/domains-extra.txt\"\n          echo \"HaGeZi TIF: $(wc -l < \"$dest\") lines.\"\n\n      # Phishing hosts (domains) from Phishing.Database. The data files are hosted on\n      # phish.co.za/latest (the GitHub repo only holds the checksums and resets its history\n      # every 24h: never clone it). The sha256 published in Phishing-Database/checksums is\n      # verified before use. Appended to domains-extra.txt, so the hosts go through the same\n      # allowlist (Tranco top-N + MISP warninglists) and validation as the other extra sources.\n      # The app matches parent domains too, so a listed registrable domain blocks all of its\n      # subdomains: the allowlist must stay in front of this source. Check the licence.\n      - name: DATABASE PREPARATION - Phishing domains\n        continue-on-error: true\n        shell: bash\n        run: |\n          ws=\"${{ github.workspace }}\"\n          dest=\"$ws/various/phishing-domains.txt\"\n          url=\"https://phish.co.za/latest/phishing-domains-ACTIVE.txt\"\n          sum_url=\"https://raw.githubusercontent.com/Phishing-Database/checksums/refs/heads/master/phishing-domains-ACTIVE.txt.sha256\"\n          ok=0\n          for attempt in 1 2; do\n            if curl -fsSL --retry 2 --max-time 180 \"$url\" -o \"$dest\" && [ -s \"$dest\" ] \\\n               && ! head -c 200 \"$dest\" | grep -qi \"<!DOCTYPE\\|<html\" \\\n               && expected=$(curl -fsSL --retry 2 --max-time 60 \"$sum_url\" | head -n1 | awk '{print $1}') \\\n               && [ -n \"$expected\" ] \\\n               && [ \"$(sha256sum \"$dest\" | awk '{print $1}')\" = \"$expected\" ]; then\n              ok=1; break\n            fi\n            # the checksum is published right after the file: give it a moment, then retry once\n            echo \"Phishing domains: download or checksum check failed (attempt $attempt).\"\n            [ \"$attempt\" = 1 ] && sleep 60\n          done\n          if [ \"$ok\" != 1 ]; then\n            echo \"::warning::Phishing domains unavailable or checksum mismatch - skipping.\"\n            exit 0\n          fi\n          tr -d '\\r' < \"$dest\" | grep -Ev '^[[:space:]]*(#|!|$)' | sed 's/^\\*\\.//' | tr '[:upper:]' '[:lower:]' \\\n            >> \"$ws/various/domains-extra.txt\"\n          echo \"Phishing domains: $(wc -l < \"$dest\") lines (sha256 verified).\"\n\n      # MalShare API. getlist only covers the LAST 24h and the schedule runs every\n      # 2 days, so hashes are accumulated in cache/malshare.csv (committed to main\n      # by the last step). Format: first_seen,md5,sha1,sha256.\n      # Secret needed: MALSHARE_KEY. One getlist call per run (quota-friendly).\n      # sha256 -> stable DB; md5 is read by generate_extended.yml from the same cache.\n      - name: DATABASE PREPARATION - MalShare (API + accumulated cache)\n        continue-on-error: true\n        shell: bash\n        env:\n          MALSHARE_KEY: ${{ secrets.MALSHARE_KEY }}\n          # Optional: comma-separated MalShare file types (see action=gettypes) to keep\n          # the DB Android-relevant; empty = everything from getlist.\n          MALSHARE_TYPES: \"\"\n          MALSHARE_RETENTION_DAYS: \"30\"\n        run: |\n          ws=\"${{ github.workspace }}\"\n          cache=\"$ws/cache/malshare.csv\"\n          prev=\"$ws/various/malshare-prev.csv\"\n          today=\"$ws/various/malshare-today.csv\"\n          mkdir -p \"$ws/cache-new\"\n          [ -f \"$cache\" ] && cp \"$cache\" \"$prev\" || : > \"$prev\"\n          : > \"$today\"\n          if [ -z \"$MALSHARE_KEY\" ]; then\n            echo \"::warning::MALSHARE_KEY secret not set - using cached MalShare data only.\"\n          else\n            fetch() {\n              curl -fsS --max-time 120 -G \"https://malshare.com/api.php\" \\\n                --data-urlencode \"api_key=${MALSHARE_KEY}\" --data-urlencode \"action=$1\" ${2:+--data-urlencode \"type=$2\"}\n            }\n            parse() {\n              jq -r '.. | objects | select(has(\"sha256\")) | [(.md5 // \"\"), (.sha1 // \"\"), (.sha256 // \"\")] | map(ascii_downcase) | join(\",\")'\n            }\n            if [ -n \"$MALSHARE_TYPES\" ]; then\n              IFS=',' read -ra types <<< \"$MALSHARE_TYPES\"\n              for t in \"${types[@]}\"; do fetch type \"$t\" | parse >> \"$today\" || echo \"::warning::MalShare type '$t' failed.\"; done\n            else\n              fetch getlist | parse >> \"$today\" || echo \"::warning::MalShare getlist failed (bad key or quota?).\"\n            fi\n            sed -i \"s/^/$(date -u +%F),/\" \"$today\"\n            echo \"MalShare: $(wc -l < \"$today\") hashes fetched today.\"\n          fi\n          # merge: keep first-seen date, drop invalid rows, prune by retention\n          cutoff=$(date -u -d \"-${MALSHARE_RETENTION_DAYS} days\" +%F)\n          cat \"$prev\" \"$today\" | grep -E '^[0-9]{4}-[0-9]{2}-[0-9]{2},[a-f0-9]{0,32},[a-f0-9]{0,40},[a-f0-9]{64}$' \\\n            | sort -t, -k1,1 | awk -F, '!seen[$4]++' | awk -F, -v c=\"$cutoff\" '$1>=c' > \"$ws/cache-new/malshare.csv\" || true\n          if [ -s \"$ws/cache-new/malshare.csv\" ]; then\n            cut -d, -f4 \"$ws/cache-new/malshare.csv\" | sort -u > \"$ws/raw/malshare.sha256\"\n            echo \"MalShare: $(wc -l < \"$ws/raw/malshare.sha256\") sha256 in DB (retention ${MALSHARE_RETENTION_DAYS}d).\"\n            if ! cmp -s \"$ws/cache-new/malshare.csv\" \"$cache\"; then echo \"MALSHARE_CACHE_UPDATED=1\" >> \"$GITHUB_ENV\"; fi\n          fi\n\n      # Domain post-processing: extra sources (MVT, Avast, URLhaus, Infosec, Citizen Lab,\n      # HaGeZi) are written to various/domains-extra.txt, filtered against an allowlist\n      # (Tranco top-N + MISP warninglists), validated, then appended to divested.txt.\n      # The Divest list itself is NOT filtered (behaviour unchanged).\n      # If the allowlist cannot be built, extras are NOT merged (avoids false positives).\n      - name: DOMAIN POST-PROCESSING - allowlist and merge\n        continue-on-error: true\n        shell: bash\n        env:\n          TRANCO_TOP: \"10000\"\n        run: |\n          ws=\"${{ github.workspace }}\"\n          allow=\"$ws/various/allowlist.txt\"\n          : > \"$allow\"\n          if curl -fsSL -L --retry 2 --max-time 180 \"https://tranco-list.eu/top-1m.csv.zip\" -o /tmp/tranco.zip \\\n             && unzip -p /tmp/tranco.zip top-1m.csv > /tmp/tranco.csv; then\n            head -n \"$TRANCO_TOP\" /tmp/tranco.csv | cut -d, -f2 | tr -d '\\r' >> \"$allow\"\n          else\n            echo \"::warning::Tranco download failed.\"\n          fi\n          git clone --depth 1 https://github.com/MISP/misp-warninglists.git \"$ws/various/misp-warninglists\" || true\n          for l in tranco10k moz-top500 common-ioc-false-positive microsoft google apple; do\n            f=\"$ws/various/misp-warninglists/lists/$l/list.json\"\n            if [ -f \"$f\" ]; then jq -r '.list[]? | strings' \"$f\" >> \"$allow\" || true; else echo \"MISP list '$l' not found, skipped.\"; fi\n          done\n          if python3 - \"$ws\" <<'PY'\n          import os, re, sys\n          ws = sys.argv[1]\n          allow = set()\n          for l in open(f\"{ws}/various/allowlist.txt\", errors=\"ignore\"):\n              d = l.strip().lower().lstrip(\"*.\").rstrip(\".\")\n              if d:\n                  allow.add(d)\n          if len(allow) < 1000:\n              print(f\"Allowlist too small ({len(allow)}).\")\n              sys.exit(2)\n          ip = re.compile(r\"^\\d{1,3}(\\.\\d{1,3}){3}$\")\n          dom = re.compile(r\"^(?=.{1,253}$)([a-z0-9_]([a-z0-9_-]{0,61}[a-z0-9_])?\\.)+[a-z][a-z0-9-]{1,62}$\")\n          kept, dropped, invalid = set(), [], 0\n          for l in open(f\"{ws}/various/domains-extra.txt\", errors=\"ignore\"):\n              d = l.strip().lower()\n              if not d or d.startswith((\"#\", \"!\")):\n                  continue\n              d = d.split()[-1].lstrip(\"*.\").rstrip(\".\")\n              if ip.match(d) or not dom.match(d):\n                  invalid += 1\n                  continue\n              base = d[4:] if d.startswith(\"www.\") else d\n              if d in allow or base in allow:\n                  dropped.append(d)\n                  continue\n              kept.add(d)\n          out = f\"{ws}/domains/divested.txt\"\n          needs_nl = os.path.exists(out) and os.path.getsize(out) > 0 and not open(out, \"rb\").read()[-1:] == b\"\\n\"\n          with open(out, \"a\") as f:\n              if needs_nl:\n                  f.write(\"\\n\")\n              f.write(\"\\n\".join(sorted(kept)) + (\"\\n\" if kept else \"\"))\n          print(f\"Extra domains: kept {len(kept)}, allowlisted {len(set(dropped))}, invalid {invalid}, allowlist size {len(allow)}.\")\n          print(\"Sample allowlisted (review for surprises):\", sorted(set(dropped))[:40])\n          PY\n          then\n            echo \"Merged extra domains into divested.txt: $(wc -l < \"$ws/domains/divested.txt\") total lines.\"\n          else\n            echo \"::warning::Allowlist step failed - extra domain sources were NOT merged.\"\n          fi\n\n      - name: GENERATE HYPATIA SIGNATURE DATABASES\n        run: |\n          mvn -q -B --no-transfer-progress clean compile exec:java \\\n            -Dexec.mainClass=\"org.maintainteam.hypatiadatabases.App\" \\\n            -Dexec.args=\"${{ github.workspace }}/raw/ ${{ github.workspace }}/domains/divested.txt\" \\\n            > \"${{ github.workspace }}/various/generation_report.txt\"\n\n          cat \"${{ github.workspace }}/various/generation_report.txt\"\n          echo \"<pre>\" >> \"${{ github.workspace }}/various/generation_report.html\"\n          cat \"${{ github.workspace }}/various/generation_report.txt\" >> \"${{ github.workspace }}/various/generation_report.html\"\n          echo \"</pre>\" >> \"${{ github.workspace }}/various/generation_report.html\"\n\n          echo \"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\" \\\n            > \"${{ github.workspace }}/various/database_generation_ci.txt\"\n\n      # ---------------------------------------------------------\n      # WHITELIST DATABASE (optional, see WHITELIST.md): known-good APK\n      # sha256 from F-Droid (+ archive) and IzzyOnDroid, deduped against\n      # the current malware sha256 database, bloom at 1e-9 fpp.\n      # continue-on-error: the app treats this file as optional (404 tolerated).\n      - name: BUILD WHITELIST DATABASE (F-Droid + archive + IzzyOnDroid)\n        continue-on-error: true\n        shell: bash\n        run: |\n          ws=\"${{ github.workspace }}\"\n          mkdir -p \"$ws/raw-whitelist\" \"$ws/production\"\n          python3 \"$ws/tools/fdroid_hashes.py\" --archive --izzy \\\n            > \"$ws/raw-whitelist/fdroid.sha256\"\n          if [ ! -s \"$ws/raw-whitelist/fdroid.sha256\" ]; then\n            echo \"::warning::No whitelist hashes extracted - skipping whitelist build.\"\n            exit 0\n          fi\n          # The whitelist must never contain a hash flagged by the malware DB:\n          # generateWhitelist() dedupes against ../production/hypatia-sha256-bloom.bin\n          cp \"$ws/raw/hypatia-sha256-bloom.bin\" \"$ws/production/\"\n          mvn -q -B --no-transfer-progress exec:java \\\n            -Dexec.mainClass=\"org.maintainteam.hypatiadatabases.App\" \\\n            -Dexec.args=\"$ws/raw-whitelist/ -whitelist\" \\\n            > \"$ws/various/whitelist_report.txt\" || true\n          cat \"$ws/various/whitelist_report.txt\" || true\n\n      # ---------------------------------------------------------\n      # STALKERWARE DATABASE (optional): package names + signing certificates from\n      # AssoEchap/stalkerware-indicators (samples.csv, already downloaded by the\n      # \"Stalkerware\" step above). Same bloom format, so the generic signing loop\n      # below (hypatia-*-bloom.bin) signs it; the app treats the file as optional.\n      # ---------------------------------------------------------\n      - name: BUILD STALKERWARE DATABASE (packages + certificates)\n        continue-on-error: true\n        shell: bash\n        run: |\n          ws=\"${{ github.workspace }}\"\n          mkdir -p \"$ws/raw-stalkerware\"\n          if [ ! -s \"$ws/various/stalkerware.csv\" ]; then\n            echo \"::warning::stalkerware.csv missing - skipping stalkerware database.\"\n            exit 0\n          fi\n          python3 \"$ws/tools/stalkerware_indicators.py\" --input \"$ws/various/stalkerware.csv\" \\\n            > \"$ws/raw-stalkerware/stalkerware.txt\" || true\n          if [ ! -s \"$ws/raw-stalkerware/stalkerware.txt\" ]; then\n            echo \"::warning::No stalkerware indicator extracted - skipping.\"\n            exit 0\n          fi\n          mvn -q -B --no-transfer-progress exec:java \\\n            -Dexec.mainClass=\"org.maintainteam.hypatiadatabases.App\" \\\n            -Dexec.args=\"$ws/raw-stalkerware/ -stalkerware\" \\\n            > \"$ws/various/stalkerware_report.txt\" || true\n          cat \"$ws/various/stalkerware_report.txt\" || true\n\n      - name: Debug Info\n        run: |\n          ls -hla \"${{ github.workspace }}/various/\"\n          ls -hla \"${{ github.workspace }}/raw/\"\n          ls -hla \"${{ github.workspace }}/exclusions/\"\n          ls -hla \"${{ github.workspace }}/domains/\"\n          tree -a \"${{ github.workspace }}\"\n\n      - name: Select files to use\n        run: |\n          mkdir -p \"${{ github.workspace }}/deploy\"\n          cp \"${{ github.workspace }}/raw/hypatia-domains-bloom.bin\" \"${{ github.workspace }}/deploy\"\n          cp \"${{ github.workspace }}/raw/hypatia-md5-bloom.bin\" \"${{ github.workspace }}/deploy\"\n          cp \"${{ github.workspace }}/raw/hypatia-sha1-bloom.bin\" \"${{ github.workspace }}/deploy\"\n          cp \"${{ github.workspace }}/raw/hypatia-sha256-bloom.bin\" \"${{ github.workspace }}/deploy\"\n          if [ -f \"${{ github.workspace }}/raw-whitelist/hypatia-whitelist-sha256-bloom.bin\" ]; then\n            cp \"${{ github.workspace }}/raw-whitelist/hypatia-whitelist-sha256-bloom.bin\" \"${{ github.workspace }}/deploy\"\n          else\n            echo \"::warning::No whitelist database produced - deploying without it (optional file).\"\n          fi\n          if [ -f \"${{ github.workspace }}/raw-stalkerware/hypatia-stalkerware-bloom.bin\" ]; then\n            cp \"${{ github.workspace }}/raw-stalkerware/hypatia-stalkerware-bloom.bin\" \"${{ github.workspace }}/deploy\"\n          else\n            echo \"::warning::No stalkerware database produced - deploying without it (optional file).\"\n          fi\n          cp \"${{ github.workspace }}/various/generation_report.html\" \"${{ github.workspace }}/deploy\"\n          cp \"${{ github.workspace }}/various/database_generation_ci.txt\" \"${{ github.workspace }}/deploy\"\n          cp \"${{ github.workspace }}/static/template.html\" \"${{ github.workspace }}/deploy\"\n          date > \"${{ github.workspace }}/deploy/generation_time.html\"\n\n      # ---------------------------------------------------------\n      #  CORRECTION GPG — version stable pour GitHub Actions\n      # ---------------------------------------------------------\n      - name: Sign databases (if GPG_PRIVATE_KEY secret is set)\n        shell: bash\n        env:\n          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}\n          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}\n        run: |\n          deploy=\"${{ github.workspace }}/deploy\"\n\n          if [ -n \"$GPG_PRIVATE_KEY\" ]; then\n            echo \"Importing signing key from secret...\"\n\n            export GNUPGHOME=\"$(mktemp -d)\"\n            chmod 700 \"$GNUPGHOME\"\n            echo \"allow-loopback-pinentry\" > \"$GNUPGHOME/gpg-agent.conf\"\n            echo \"$GPG_PRIVATE_KEY\" | gpg --batch --yes --import\n\n            keyid=$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr/{print $10; exit}')\n\n            for f in \"$deploy\"/hypatia-*-bloom.bin; do\n              # NB: .sig MUST be binary (no --armor): Hypatia parses it\n              # with PGPObjectFactory, which cannot decode armored input.\n              gpg --batch --yes --pinentry-mode loopback \\\n                  --passphrase \"$GPG_PASSPHRASE\" \\\n                  --detach-sign \\\n                  --local-user \"$keyid\" \\\n                  --output \"$f.sig\" \"$f\"\n            done\n\n            gpg --batch --armor --export \"$keyid\" > \"$deploy/gpg.key\"\n\n            # Self-check: every .sig must verify against its .bin before deploy\n            for f in \"$deploy\"/hypatia-*-bloom.bin; do\n              gpg --batch --yes --verify \"$f.sig\" \"$f\" || { echo \"::error::GPG verification failed for $f\"; exit 1; }\n            done\n            echo \"Self-check passed: all signatures verify.\"\n            echo \"Signed databases with key $keyid\"\n            echo \"SIGNING_KEY_FOR_APP=$keyid\" >> \"$GITHUB_STEP_SUMMARY\"\n\n            # Upstream-identical index metadata files\n            shortid=\"${keyid: -16}\"\n            signer=$(gpg --list-secret-keys --with-colons | awk -F: '/^uid/{print $10; exit}' | grep -oE '<[^>]+>' | head -1 | tr -d '<>')\n            echo \"$shortid\" > \"$deploy/sign_key.txt\"\n            echo \"$signer\" > \"$deploy/signer.txt\"\n            date > \"$deploy/sign_time.html\"\n\n          else\n            echo \"::warning::GPG_PRIVATE_KEY secret not set — deploying unsigned.\"\n            cp \"${{ github.workspace }}/gpg.key\" \"$deploy/\" || true\n            cp \"${{ github.workspace }}\"/*.bin.sig \"$deploy/\" 2>/dev/null || true\n          fi\n\n      # Replicates the index page of maintainteam.github.io/HypatiaDatabases:\n      # file tree (tree -s -D), signing info, then the stats template.\n      # Rendered to HTML with pandoc: no Jekyll needed, so the .nojekyll\n      # file that peaceiris recreates on every deploy is harmless.\n      - name: Build index.html (upstream-identical page layout)\n        shell: bash\n        run: |\n          deploy=\"${{ github.workspace }}/deploy\"\n          shortid=$(cat \"$deploy/sign_key.txt\" 2>/dev/null || echo \"unknown\")\n          signer=$(cat \"$deploy/signer.txt\" 2>/dev/null || echo \"unknown\")\n          cd \"$deploy\"\n          {\n            echo \"# Files\"\n            echo \"\"\n            tree -a -s -D --timefmt='%d-%b-%Y %H:%M' . | sed 's/$/  /'\n            echo \"\"\n            echo \"* * *\"\n            echo \"\"\n            echo \"Signing Key: $shortid  \"\n            echo \"Signed by: $signer  \"\n            echo \"Current Databases created with: CI  \"\n            echo \"Signed & Created Report with GitHub Actions CI\"\n            echo \"\"\n            echo \"* * *\"\n            echo \"\"\n            cat \"$deploy/template.html\"\n          } > \"$deploy/index.md\"\n          pandoc \"$deploy/index.md\" -o \"$deploy/index.html\"\n          rm -f \"$deploy/index.md\"\n\n      - name: Deploy to unsigned branch\n        uses: peaceiris/actions-gh-pages@v4\n        with:\n          github_token: ${{ secrets.GITHUB_TOKEN }}\n          publish_dir: \"${{ github.workspace }}/deploy\"\n          # force_orphan must stay false: the unsigned branch also hosts the\n          # extended md5 database deployed by generate_extended.yml\n          force_orphan: false\n          keep_files: true\n          publish_branch: unsigned\n\n      - name: Commit refreshed caches (divest.zip, malshare)\n        if: env.DIVEST_CACHE_UPDATED == '1' || env.MALSHARE_CACHE_UPDATED == '1'\n        shell: bash\n        run: |\n          git config user.name \"github-actions[bot]\"\n          git config user.email \"github-actions[bot]@users.noreply.github.com\"\n          git fetch origin main\n          git checkout -B main origin/main\n          if [ \"$DIVEST_CACHE_UPDATED\" = \"1\" ]; then\n            cp \"${{ github.workspace }}/cache-new/divest.zip\" \"${{ github.workspace }}/divest.zip\"\n            git add divest.zip\n          fi\n          if [ \"$MALSHARE_CACHE_UPDATED\" = \"1\" ]; then\n            mkdir -p cache\n            cp \"${{ github.workspace }}/cache-new/malshare.csv\" cache/malshare.csv\n            git add cache/malshare.csv\n          fi\n          git commit -m \"Refresh caches [skip ci]\" || exit 0\n          git push origin main\n\n","file_size_bytes":52856,"returned_bytes":52856,"offset":0,"lines_read":980,"was_truncated":false,"total_lines":980,"next_offset":null}