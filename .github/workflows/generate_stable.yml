name: Generate Stable Database

on:
  workflow_dispatch:
  schedule:
    - cron: '0 1 * * *'

# Évite deux runs en parallèle (cache abuse.ch, déploiement gh-pages, commit des caches)
concurrency:
  group: hypatia-generate
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions: write-all

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Dependency Setup
        run: |
          sudo apt-get update -y
          sudo apt install maven unzip git dos2unix pandoc -y

      - name: Start ClamAV daemon clamd
        uses: toblux/start-clamd-github-action@v0.3
        with:
          db_main: true
          db_daily: true
      
      - name: Organize Directories & Static Sources
        run: |
          mkdir -p "${{ github.workspace }}/raw/"
          mkdir -p "${{ github.workspace }}/exclusions/"
          mkdir -p "${{ github.workspace }}/various/"
          mkdir -p "${{ github.workspace }}/domains/"
          mkdir -p "${{ github.workspace }}/cache-new/"
          mkdir -p "${{ github.workspace }}/abusech-cache/"
          : > "${{ github.workspace }}/various/domains-extra.txt"
          cp ${{ github.workspace }}/static/* "${{ github.workspace }}/raw/"

      - name: DATABASE PREPARATION - ClamAV
        run: |
          mkdir /tmp/mss
          cd /tmp/mss
          cp /var/lib/clamav/main.c*d .
          cp /var/lib/clamav/daily.c*d .
          sigtool -u main.c*d
          sigtool -u daily.c*d
          mv /tmp/mss/*.fp* "${{ github.workspace }}/exclusions/"
          mv /tmp/mss/*.hsb "${{ github.workspace }}/raw/"
          mv /tmp/mss/*.hdb "${{ github.workspace }}/raw/"
          mv /tmp/mss/*.hdu "${{ github.workspace }}/raw/"
          mv /tmp/mss/*.hsu "${{ github.workspace }}/raw/"

      - name: DATABASE PREPARATION - ESET
        continue-on-error: true
        run: |
          git clone --depth 1 https://github.com/eset/malware-ioc "${{ github.workspace }}/various/eset-sources/"
          processHashes() {
            local name=$(basename $1);
            if [ -f $1/samples.$2 ]; then
              dos2unix -q $1/samples.$2
              while IFS= read -r line
              do
                echo "$line" >> "${{ github.workspace }}/various/eset.$2";
              done < "$1/samples.$2";
            fi;
          }
          export -f processHashes;
          find "${{ github.workspace }}/various/eset-sources/" -maxdepth 2 -mindepth 1 -type d -exec bash -c 'processHashes "{}" md5 hdb' \;
          find "${{ github.workspace }}/various/eset-sources/" -maxdepth 2 -mindepth 1 -type d -exec bash -c 'processHashes "{}" sha1 hsb' \;
          find "${{ github.workspace }}/various/eset-sources/" -maxdepth 2 -mindepth 1 -type d -exec bash -c 'processHashes "{}" sha256 hsb' \;
          cp "${{ github.workspace }}/various/eset.md5" "${{ github.workspace }}/raw"
          cp "${{ github.workspace }}/various/eset.sha1" "${{ github.workspace }}/raw"
          cp "${{ github.workspace }}/various/eset.sha256" "${{ github.workspace }}/raw"

      - name: DATABASE PREPARATION - Signature-Base
        continue-on-error: true
        run: |
          wget https://raw.githubusercontent.com/Neo23x0/signature-base/refs/heads/master/iocs/hash-iocs.txt -O "${{ github.workspace }}/raw/signature-base.loki"

      - name: DATABASE PREPARATION - ThreatView
        continue-on-error: true
        run: |
          wget "https://threatview.io/Downloads/MD5-HASH-ALL.txt" -O - | sed 's/MD5 of //' >> "${{ github.workspace }}/various/threatview.md5"
          wget "https://threatview.io/Downloads/SHA-HASH-FEED.txt" -O - >> "${{ github.workspace }}/various/threatview.sha1"
          sort -u -o "${{ github.workspace }}/raw/threatview.md5" "${{ github.workspace }}/various/threatview.md5"
          sort -u -o "${{ github.workspace }}/raw/threatview.sha1" "${{ github.workspace }}/various/threatview.sha1"
          for t in md5 sha1; do
            n=$(wc -l < "${{ github.workspace }}/raw/threatview.$t")
            echo "ThreatView $t: $n lignes."
            [ "$n" -ge 10 ] || echo "::warning::ThreatView $t : seulement $n lignes (flux vide ou limité ?)."
          done

      # ---------------------------------------------------------
      # Cache de secours abuse.ch (ThreatFox + MalwareBazaar).
      # Stocké dans le cache GitHub Actions (pas dans le repo : la liste
      # MalwareBazaar complète pèse des dizaines de Mo une fois compressée).
      # Chaque run réussi enregistre une nouvelle entrée ; au run suivant on
      # restaure la plus récente (restore-keys). Les entrées non utilisées
      # pendant 7 jours sont purgées par GitHub : avec un run quotidien,
      # le cache reste toujours vivant.
      # ---------------------------------------------------------
      - name: Restore abuse.ch fallback cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ github.workspace }}/abusech-cache
          key: abusech-${{ github.run_id }}
          restore-keys: |
            abusech-

      # abuse.ch now requires a free Auth-Key (https://auth.abuse.ch).
      # Add it in: Settings > Secrets and variables > Actions > New secret
      # Name: ABUSECH_KEY
      # Téléchargement : HTTP/1.1 forcé (évite "HTTP/2 stream ... INTERNAL_ERROR"),
      # 3 tentatives, contrôle de taille minimale, sinon repli sur le cache.
      - name: DATABASE PREPARATION - ThreatFox
        continue-on-error: true
        shell: bash
        env:
          ABUSECH_KEY: ${{ secrets.ABUSECH_KEY }}
          TF_MIN_LINES: "1000"
        run: |
          ws="${{ github.workspace }}"
          cdir="$ws/abusech-cache"
          cfile="$cdir/threatfox.sha256.gz"
          out="$ws/raw/threatfox.sha256"
          dl="$ws/various/download_threatfox.zip"
          mkdir -p "$ws/various/threatfox" "$cdir"
          fresh=0

          if [ -z "$ABUSECH_KEY" ]; then
            echo "::warning::ABUSECH_KEY secret not set - cannot download ThreatFox."
          else
            for attempt in 1 2 3; do
              rm -f "$dl"; rm -rf "$ws/various/threatfox"/*
              if curl -fsSL --http1.1 --retry 3 --retry-delay 10 --retry-all-errors --max-time 600 \
                   "https://threatfox-api.abuse.ch/v2/files/exports/${ABUSECH_KEY}/full.csv.zip" -o "$dl" \
                 && unzip -tq "$dl" >/dev/null 2>&1 \
                 && unzip -o -q "$dl" -d "$ws/various/threatfox/"; then
                cat "$ws"/various/threatfox/*.csv \
                  | grep sha256_hash \
                  | grep -oE '\b[a-fA-F0-9]{64}\b' \
                  | tr '[:upper:]' '[:lower:]' | sort -u \
                  > "$out.tmp" || true
                # Domain/host IOCs too (the export CSV carries them alongside the hashes)
                cat "$ws"/various/threatfox/*.csv \
                  | tr '[:upper:]' '[:lower:]' \
                  | grep -oE '\b([a-z0-9]([a-z0-9-]*[a-z0-9])?\.)+[a-z]{2,}\b' \
                  | grep -vE '\.(csv|zip|txt|html?|php|asp|aspx|js|css|png|jpe?g|gif|svg|ico|pdf|xml|json)$' \
                  | sort -u >> "$ws/various/domains-extra.txt" || true
                n=$(wc -l < "$out.tmp")
                if [ "$n" -ge "$TF_MIN_LINES" ]; then
                  mv "$out.tmp" "$out"; fresh=1; break
                fi
                echo "::warning::ThreatFox attempt $attempt: only $n hashes (expected >= $TF_MIN_LINES)."
              else
                echo "::warning::ThreatFox download attempt $attempt failed."
              fi
              rm -f "$out.tmp"
              sleep $((attempt * 20))
            done
          fi

          if [ "$fresh" = 1 ]; then
            gzip -c "$out" > "$cfile"
            echo "ABUSECH_CACHE_UPDATED=1" >> "$GITHUB_ENV"
            echo "ThreatFox: $(wc -l < "$out") sha256 signatures (fresh download, cache refreshed)."
          elif [ -s "$cfile" ]; then
            gunzip -c "$cfile" > "$out"
            echo "::warning::ThreatFox download failed - using cached copy from $(date -u -r "$cfile" +%Y-%m-%d)."
            echo "ThreatFox: $(wc -l < "$out") sha256 signatures (from cache)."
          else
            echo "::warning::ThreatFox download failed and no cache available - skipping."
          fi

      # MalwareBazaar : le full.csv.zip (~19 Mo) est coupé en cours de route
      # par le serveur ("unexpected eof"). On passe donc en incrémental :
      #   - le cache contient l'ensemble cumulé des sha256
      #   - chaque run ajoute recent.csv (petit, quasi jamais coupé)
      #   - le full n'est retenté qu'en cas de cache vide ou tous les 7 jours,
      #     avec reprise du téléchargement (-C -) au lieu de repartir de zéro
      - name: DATABASE PREPARATION - MalwareBazaar
        continue-on-error: true
        shell: bash
        env:
          ABUSECH_KEY: ${{ secrets.ABUSECH_KEY }}
          MB_FULL_EVERY_DAYS: "30"
          MB_FULL_RETRY_DAYS: "3"
          MB_MIN_FULL: "100000"
        run: |
          ws="${{ github.workspace }}"
          cdir="$ws/abusech-cache"
          cfile="$cdir/malware_bazaar.sha256.gz"
          stamp="$cdir/malware_bazaar.full_date"
          tried="$cdir/malware_bazaar.full_try"
          out="$ws/raw/malware_bazaar.sha256"
          tmpd="$ws/various/bazaar"
          mkdir -p "$tmpd" "$cdir"
          base="https://mb-api.abuse.ch/v2/files/exports/${ABUSECH_KEY}"

          # Télécharge avec reprise. Réussi = fichier complet (zip valide ou CSV non vide)
          # Téléchargement par morceaux (Range) : chaque morceau est petit, donc passe
          # avant la coupure du serveur ; il est refait seul s'il échoue, en parallèle.
          fetch_chunked() { # $1=fichier distant  $2=destination
            local f="$1" dl="$2" size n i
            export MB_URL="$base/$f" MB_DL="$dl" MB_CHUNK="${MB_CHUNK_BYTES:-16777216}"
            # 1) taille via une requête Range 0-0 (Content-Range: bytes 0-0/TOTAL), 2) sinon via HEAD
            size=$(curl -sL --http1.1 --connect-timeout 20 --max-time 60 -r 0-0 -D - -o /dev/null "$MB_URL" 2>/dev/null \
                   | tr -d '\r' | awk 'tolower($1)=="content-range:"{split($3,a,"/"); v=a[2]} END{print v+0}')
            if [ "${size:-0}" -le 1 ]; then
              size=$(curl -sIL --http1.1 --connect-timeout 20 --max-time 60 "$MB_URL" 2>/dev/null \
                     | tr -d '\r' | awk 'tolower($1)=="content-length:"{v=$2} END{print v+0}')
            fi
            [ "${size:-0}" -gt 1 ] || echo "::warning::MalwareBazaar $f : taille introuvable (ni Content-Range ni Content-Length)."
            [ "${size:-0}" -gt 1 ] || return 1
            export MB_SIZE="$size"
            n=$(( (size + MB_CHUNK - 1) / MB_CHUNK ))
            echo "MalwareBazaar $f : $size octets, $n morceaux de $((MB_CHUNK / 1048576)) Mo."
            getchunk() {
              local i="$1" start end want part sz t
              start=$(( i * MB_CHUNK )); end=$(( start + MB_CHUNK - 1 ))
              [ "$end" -ge "$MB_SIZE" ] && end=$(( MB_SIZE - 1 ))
              want=$(( end - start + 1 )); part="$MB_DL.part$i"
              for t in 1 2 3 4 5 6; do
                sz=$(stat -c %s "$part" 2>/dev/null || echo 0)
                [ "$sz" -eq "$want" ] && return 0
                curl -fsS --http1.1 --connect-timeout 20 --max-time 300 \
                     -r "$((start + sz))-$end" "$MB_URL" >> "$part" 2>/dev/null || sleep 3
              done
              [ "$(stat -c %s "$part" 2>/dev/null || echo 0)" -eq "$want" ]
            }
            export -f getchunk
            rm -f "$dl".part*
            seq 0 $((n - 1)) | xargs -P 4 -I{} bash -c 'getchunk {}' || { echo "::warning::MalwareBazaar $f : morceaux manquants."; return 1; }
            for i in $(seq 0 $((n - 1))); do cat "$dl.part$i"; done > "$dl" && rm -f "$dl".part*
            unzip -tq "$dl" >/dev/null 2>&1
          }

          fetch() { # $1=fichier distant  $2=destination
            local f="$1" dl="$2" i rc size last=-1 stalls=0
            rm -f "$dl"
            case "$f" in *.zip) fetch_chunked "$f" "$dl" && return 0; echo "::warning::MalwareBazaar $f : mode par morceaux indisponible, reprise classique."; rm -f "$dl" ;; esac
            for i in $(seq 1 10); do
              rc=0
              curl -fsSL --http1.1 -C - --connect-timeout 20 --max-time 300 \
                   "$base/$f" -o "$dl" || rc=$?
              size=$(stat -c %s "$dl" 2>/dev/null || echo 0)
              if [ $rc -eq 0 ]; then
                case "$f" in *.zip) unzip -tq "$dl" >/dev/null 2>&1 && return 0 ;; *) [ -s "$dl" ] && return 0 ;; esac
              fi
              # 33 = le serveur ne gère pas Range -> on repart de zéro
              if [ $rc -eq 33 ] || [ $rc -eq 22 ]; then rm -f "$dl"; size=0; fi
              echo "::warning::MalwareBazaar $f tentative $i (curl rc=$rc, $size octets reçus)"
              # Abandon si le téléchargement n'avance plus (2 tentatives sans progrès)
              if [ "$size" -le "$last" ]; then stalls=$((stalls + 1)); else stalls=0; fi
              [ $stalls -ge 2 ] && { echo "::warning::MalwareBazaar $f : aucun progrès, abandon."; return 1; }
              last=$size
              sleep 5
            done
            return 1
          }

          # Extrait les sha256 d'un zip ou d'un fichier texte
          hashes() { # $1=fichier
            if unzip -tq "$1" >/dev/null 2>&1; then unzip -p "$1"; else cat "$1"; fi \
              | grep -oE '\b[a-fA-F0-9]{64}\b' | tr 'A-F' 'a-f'
          }

          [ -s "$cfile" ] && gunzip -c "$cfile" > "$tmpd/cache.txt" || : > "$tmpd/cache.txt"
          prev=$(wc -l < "$tmpd/cache.txt")
          : > "$tmpd/new.txt"

          age() { [ -s "$1" ] && echo $(( ( $(date +%s) - $(date -d "$(cat "$1")" +%s) ) / 86400 )) || echo 9999; }
          need_full=0
          if [ "$prev" -lt "$MB_MIN_FULL" ]; then need_full=1   # amorçage : cache vide
          elif [ "$(age "$stamp")" -ge "$MB_FULL_EVERY_DAYS" ] && [ "$(age "$tried")" -ge "$MB_FULL_RETRY_DAYS" ]; then need_full=1
          fi
          [ "$need_full" = 1 ] && date -u +%Y-%m-%d > "$tried"

          got_full=0; got_recent=0
          if [ -z "$ABUSECH_KEY" ]; then
            echo "::warning::ABUSECH_KEY secret not set - cannot download MalwareBazaar."
          else
            if [ "$need_full" = 1 ] && fetch full.csv.zip "$tmpd/full.zip"; then
              { hashes "$tmpd/full.zip" || true; } | sort -u > "$tmpd/full.txt"; n=$(wc -l < "$tmpd/full.txt")
              if [ "$n" -ge "$MB_MIN_FULL" ]; then cat "$tmpd/full.txt" >> "$tmpd/new.txt"; got_full=1; fi
            fi
            if fetch recent.csv "$tmpd/recent.csv"; then
              { hashes "$tmpd/recent.csv" || true; } >> "$tmpd/new.txt"; got_recent=1
            fi
          fi

          # Fusion cache + nouveautés, avec garde-fou contre un fichier qui rétrécit
          sort -u "$tmpd/cache.txt" "$tmpd/new.txt" > "$out.tmp"
          n=$(wc -l < "$out.tmp")
          if [ "$n" -ge "$prev" ] && [ "$n" -ge "$MB_MIN_FULL" ] && { [ "$got_full" = 1 ] || [ "$got_recent" = 1 ]; }; then
            mv "$out.tmp" "$out"
            gzip -c "$out" > "$cfile"
            [ "$got_full" = 1 ] && date -u +%Y-%m-%d > "$stamp"
            echo "ABUSECH_CACHE_UPDATED=1" >> "$GITHUB_ENV"
            echo "MalwareBazaar: $n sha256 (+$((n - prev)); full=$got_full recent=$got_recent, cache refreshed)."
          elif [ "$prev" -ge "$MB_MIN_FULL" ]; then
            rm -f "$out.tmp"; cp "$tmpd/cache.txt" "$out"
            echo "::warning::MalwareBazaar: aucun téléchargement réussi - cache utilisé ($prev sha256)."
          else
            rm -f "$out.tmp"
            echo "::warning::MalwareBazaar failed and no usable cache - skipping."
          fi

      # Enregistre le cache uniquement si au moins un téléchargement a réussi
      - name: Save abuse.ch fallback cache
        if: env.ABUSECH_CACHE_UPDATED == '1'
        uses: actions/cache/save@v6
        with:
          path: ${{ github.workspace }}/abusech-cache
          key: abusech-${{ github.run_id }}

      - name: DATABASE PREPARATION - Stalkerware
        continue-on-error: true
        run: |
          wget "https://raw.githubusercontent.com/AssoEchap/stalkerware-indicators/refs/heads/master/samples.csv" -O "${{ github.workspace }}/various/stalkerware.csv"
          while IFS=, read -r col1SHA col2Package col3Certificate col4Version col5Name
          do
            if [ -n "$col1SHA" ] && [ -n "$col5Name" ]; then
              echo "$col1SHA:0:$col5Name" >> "${{ github.workspace }}/raw/stalkerware.hsb";
            fi;
          done < "${{ github.workspace }}/various/stalkerware.csv";
          sed -i '1d' "${{ github.workspace }}/raw/stalkerware.hsb";

      # rsync sans permissions/propriétaire distants (-a les applique et échoue si le
      # miroir envoie des attributs bizarres : "Permission denied (13)", code 23),
      # 3 essais, et un échec n'arrête plus tout le job.
      - name: DATABASE PREPARATION - Sanesecurity
        continue-on-error: true
        shell: bash
        run: |
          shopt -s nullglob
          ws="${{ github.workspace }}"
          d="$ws/various/sanesecurity-real"
          mkdir -p "$d"; cd "$d"
          ok=0
          for i in 1 2 3; do
            rc=0
            rsync -rltv --no-perms --no-owner --no-group --chmod=D755,F644 rsync://rsync.sanesecurity.net/sanesecurity . || rc=$?
            if [ $rc -eq 0 ]; then ok=1; break; fi
            echo "::warning::Sanesecurity rsync tentative $i échouée (code $rc)"
            chmod -R u+rwX "$d" 2>/dev/null || true
            sleep $((i * 15))
          done
          # Même en échec partiel, on exploite les fichiers déjà reçus
          for ext in hsb hdb; do
            for f in *."$ext"; do
              echo "" >> "$ws/raw/sanesecurity-$f"
              cat "$f" >> "$ws/raw/sanesecurity-$f"
              sort -u -o "$ws/raw/sanesecurity-$f" "$ws/raw/sanesecurity-$f"
            done
          done
          rm -fv "$ws/raw/sanesecurity-crdfam.clamav.hdb" "$ws/raw/sanesecurity-doppelstern.hdb" "$ws/raw/sanesecurity-malware.expert.hdb"
          [ "$ok" = 1 ] && echo "Sanesecurity: OK ($(ls *.hsb *.hdb 2>/dev/null | wc -l) fichiers hash)." \
                        || echo "::warning::Sanesecurity: échec rsync, $(ls *.hsb *.hdb 2>/dev/null | wc -l) fichiers hash exploités."

      - name: DATABASE PREPARATION - Avast Covid-19 IOC
        continue-on-error: true
        run: |
          cd "${{ github.workspace }}/various"
          git clone --depth 1 https://github.com/avast/covid-19-ioc.git
          cd "covid-19-ioc/datasets/android"
          tail -n +2 *.csv | sed 's/,/ , /' | awk '{ print $1 }' | sort -u  >> "${{ github.workspace }}/raw/avast-covid19.sha256"

      - name: DATABASE PREPARATION - Targeted Threats
        continue-on-error: true
        run: |
          cd "${{ github.workspace }}/various"
          git clone --depth 1 https://github.com/botherder/targetedthreats.git
          cd targetedthreats
          while IFS=, read -r col1MD5 col2SHA256 col3Family col4Actor col5Country col6Report
          do
            col4Actor=$(sed -e 's/^"//' -e 's/"$//' <<< "$col4Actor");
            col3Family=$(sed -e 's/^"//' -e 's/"$//' <<< "$col3Family");
            if [ -n "$col4Actor" ] && [ -n "$col3Family" ]; then
              description="$col4Actor-$col3Family";
            elif [ -n "$col4Actor" ] && [ -z "$col3Family" ]; then
              description="$col4Actor";
            elif [ -z "$col4Actor" ] && [ -n "$col3Family" ]; then
              description="$col3Family";
            fi;
            if [ -z "$description" ]; then
              description="targetedthreats";
            fi;
            col1MD5=$(sed -e 's/^"//' -e 's/"$//' <<< "$col1MD5");
            if [ -n "$col1MD5" ]; then
              echo "$col1MD5:0:$description" >> ${{ github.workspace }}/raw/targetedthreats.hdb;
            fi;
            col2SHA256=$(sed -e 's/^"//' -e 's/"$//' <<< "$col2SHA256");
            if [ -n "$col2SHA256" ]; then
              echo "$col2SHA256:0:$description" >> ${{ github.workspace }}/raw/targetedthreats.hsb;
            fi;
          done < samples.csv;
          sed -i '1d' ${{ github.workspace }}/raw/targetedthreats.hdb;
          sed -i '1d' ${{ github.workspace }}/raw/targetedthreats.hsb;

      - name: DATABASE PREPARATION - Divest Domains (best effort, cache fallback)
        shell: bash
        continue-on-error: true
        env:
          DIVEST_MAX_AGE_DAYS: "14"
        run: |
          output="${{ github.workspace }}/domains/divested.txt"
          cache="${{ github.workspace }}/divest.zip"
          UA="Mozilla/5.0 (X11; Linux x86_64; rv:128.0) Gecko/20100101 Firefox/128.0"
          headers=(-H "User-Agent: $UA"
                   -H "Accept: text/plain,text/html,application/xhtml+xml;q=0.9,*/*;q=0.8"
                   -H "Accept-Language: en-US,en;q=0.5"
                   -H "Accept-Encoding: identity")
          observed=""

          try_fetch() {
            local url="$1" dest="$2" code
            code=$(curl -sS -L -o "$dest" -w "%{http_code}" --max-time 120 \
              --retry 2 --retry-all-errors "${headers[@]}" "$url" 2>&1) || true
            observed="${observed}[${url} => ${code}] "
            [ -s "$dest" ] || return 1
            head -c 200 "$dest" | grep -qi "<!DOCTYPE\|<html" && return 1
            return 0
          }

          ok=0
          if try_fetch "https://divested.dev/hosts-domains" "$output"; then
            ok=1; echo "Downloaded fresh Divest domains list."
            # Fresh download succeeded: also refresh the divest.zip cache
            # in the repo so the fallback stays current.
            rm -rf /tmp/divest-refresh && mkdir -p /tmp/divest-refresh
            cp "$output" /tmp/divest-refresh/divested.txt
            (cd /tmp/divest-refresh && zip -q -r divest.zip divested.txt)
            mkdir -p "${{ github.workspace }}/cache-new"
            cp /tmp/divest-refresh/divest.zip "${{ github.workspace }}/cache-new/divest.zip"
            echo "DIVEST_CACHE_UPDATED=1" >> "$GITHUB_ENV"
          elif try_fetch "https://divested.dev/hosts-domains-wildcards" /tmp/divest-wc.txt; then
            grep -Ev "^[[:space:]]*(#|$|\*\.)" /tmp/divest-wc.txt > "$output" || true
            if [ -s "$output" ]; then ok=1; echo "::warning::Primary endpoint failed; used wildcards list."; fi
          elif try_fetch "https://divested.dev/hosts" /tmp/divest-hosts.txt; then
            awk '($1=="0.0.0.0" || $1=="127.0.0.1") && $2 !~ /^#/ {print $2}' /tmp/divest-hosts.txt | sort -u > "$output" || true
            if [ -s "$output" ]; then ok=1; echo "::warning::Domain endpoints failed; extracted domains from hosts list."; fi
          fi

          if [ "$ok" != 1 ] && [ -f "$cache" ]; then
            rm -rf /tmp/divest-cache && mkdir -p /tmp/divest-cache
            if unzip -o -q "$cache" -d /tmp/divest-cache; then
              # divest.zip contains a browser snapshot (.mhtml): decode MIME, extract the <pre> block
              python3 - /tmp/divest-cache "$output" <<'PY' && ok=1
          import sys, os, re, html, email, email.policy
          src, out = sys.argv[1], sys.argv[2]
          domain = re.compile(r"^[A-Za-z0-9_]([A-Za-z0-9_-]*[A-Za-z0-9_])?(\.[A-Za-z0-9_]([A-Za-z0-9_-]*[A-Za-z0-9_])?)+$")
          best = []
          for root, _, files in os.walk(src):
              for name in files:
                  raw = open(os.path.join(root, name), "rb").read()
                  text = None
                  if name.lower().endswith((".mhtml", ".mht")) or raw[:5] == b"From:":
                      msg = email.message_from_bytes(raw, policy=email.policy.default)
                      for part in msg.walk():
                          if part.get_content_type() == "text/html":
                              text = part.get_content()
                              break
                      if text is not None:
                          m = re.search(r"<pre[^>]*>(.*?)</pre>", text, re.S | re.I)
                          text = html.unescape(m.group(1) if m else re.sub(r"<[^>]+>", "", text))
                  else:
                      text = raw.decode("utf-8", "ignore")
                  if not text:
                      continue
                  lines = set()
                  for l in text.splitlines():
                      l = l.strip().lower()
                      if l and not l.startswith("#") and not l.startswith("*.") and domain.match(l):
                          lines.add(l)
                  if len(lines) > len(best):
                      best = sorted(lines)
          if not best:
              sys.exit(1)
          open(out, "w").write("\n".join(best) + "\n")
          PY
              if [ "$ok" = 1 ]; then
                # Âge réel du snapshot : en-tête Date: du .mhtml sinon date des fichiers dans le zip
                # (la date du fichier sur le runner = date du checkout, donc inutilisable).
                read -r snap age < <(python3 - "$cache" <<'PY'
          import sys, zipfile, datetime, email.utils
          z = zipfile.ZipFile(sys.argv[1])
          best = None
          for info in z.infolist():
              d = datetime.datetime(*info.date_time)
              if info.filename.lower().endswith((".mhtml", ".mht")):
                  head = z.read(info.filename)[:4096].decode("utf-8", "ignore")
                  for line in head.splitlines():
                      if line.lower().startswith("date:"):
                          try:
                              d = email.utils.parsedate_to_datetime(line[5:].strip()).replace(tzinfo=None)
                          except Exception:
                              pass
                          break
              best = d if best is None or d > best else best
          print(best.strftime("%Y-%m-%d"), (datetime.datetime.utcnow() - best).days)
          PY
                )
                echo "::warning::divested.dev unreachable (${observed}) — using cached divest.zip (snapshot of ${snap:-unknown}, ${age:-?} days old)."
                if [ "${age:-0}" -ge "${DIVEST_MAX_AGE_DAYS:-14}" ]; then
                  echo "::warning::divest.zip is ${age} days old (limit ${DIVEST_MAX_AGE_DAYS:-14}) — refresh it manually."
                fi
              fi
            fi
          fi

          if [ "$ok" != 1 ]; then
            echo "::warning::All divested.dev endpoints failed and no usable cache — continuing without this source. HTTP results: ${observed}"
            : > "$output"
          fi
          echo "Divest domains file: $(wc -l < "$output") lines."

      - name: DATABASE PREPARATION - Zimperium IOC
