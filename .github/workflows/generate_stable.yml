      # https://github.com/MaintainTeam/HypatiaDatabases/issues/20
      # avast/ioc (Gen Threat Labs, DRL 1.1): hashes from samples.* files +
      # domains from defanged text files (hxxps://, domain[.]tld).
      - name: DATABASE PREPARATION - Avast IOC
        continue-on-error: true
        run: |
          git clone --depth 1 https://github.com/avast/ioc "${{ github.workspace }}/various/avast-ioc/"
          avastdir="${{ github.workspace }}/various/avast-ioc"
          # --- hashes ---
          # awk guarantees one hash per line even if source files lack trailing newlines
          find "$avastdir" -type f -name "samples.md5" -exec awk 1 {} + > "${{ github.workspace }}/various/avast.md5" || true
          find "$avastdir" -type f -name "samples.sha1" -exec awk 1 {} + > "${{ github.workspace }}/various/avast.sha1" || true
          find "$avastdir" -type f -name "samples.sha256" -exec awk 1 {} + > "${{ github.workspace }}/various/avast.sha256" || true
          for h in md5 sha1 sha256; do
            if [ -s "${{ github.workspace }}/various/avast.$h" ]; then
              sort -u -o "${{ github.workspace }}/raw/avast.$h" "${{ github.workspace }}/various/avast.$h"
            fi
          done
          # --- domains: defang (hxxp -> http, [.] -> .) then extract hostnames ---
          find "$avastdir" -type f -name "*.txt" -exec cat {} + > "${{ github.workspace }}/various/avast-all.txt" 2>/dev/null || true
          if [ -s "${{ github.workspace }}/various/avast-all.txt" ]; then
            sed -e "s/hxxps/http/g" -e "s/hxxp/http/g" -e "s/\[:\]/:/g" -e "s/\[\.\]/./g" -e "s/\[,\]/,/g" \
              "${{ github.workspace }}/various/avast-all.txt" \
              | grep -oE "([a-zA-Z0-9]([a-zA-Z0-9-]*[a-zA-Z0-9])?\.)+[a-zA-Z]{2,}" \
              | tr "[:upper:]" "[:lower:]" | sort -u \
              >> "${{ github.workspace }}/various/domains-extra.txt" || true
            echo "Avast IOC: domains extracted from $(wc -l < "${{ github.workspace }}/various/avast-all.txt") lines."
          fi
      # abuse.ch URLhaus: the old public downloads (hostfile, csv_recent) now answer 401.
      # New export API: https://urlhaus-api.abuse.ch/v2/files/exports/<AUTH-KEY>/<file>
      # (same pattern as ThreatFox / MalwareBazaar). Needs the ABUSECH_KEY secret.
      # recent.csv is used by default; if you see the exact name of the hostfile export
      # when logged in on https://urlhaus.abuse.ch/api/, set URLHAUS_EXPORT_FILE to it
      # (both CSV and hosts formats are parsed). Output: various/domains-extra.txt.
      - name: DATABASE PREPARATION - URLhaus (export API)
        continue-on-error: true
        shell: bash
        env:
          ABUSECH_KEY: ${{ secrets.ABUSECH_KEY }}
          URLHAUS_EXPORT_FILE: recent.csv
          URLHAUS_ONLY_ONLINE: "1"
        run: |
          ws="${{ github.workspace }}"
          if [ -z "$ABUSECH_KEY" ]; then
            echo "::warning::ABUSECH_KEY secret not set - skipping URLhaus."
            exit 0
          fi
          dl="$ws/various/urlhaus-export.txt"
          code=$(curl -sS -L --http1.1 --retry 3 --retry-all-errors --max-time 180 -H "Auth-Key: ${ABUSECH_KEY}" \
            -o "$dl" -w "%{http_code}" "https://urlhaus-api.abuse.ch/v2/files/exports/${ABUSECH_KEY}/${URLHAUS_EXPORT_FILE}") || true
          if [ "$code" != "200" ] || [ ! -s "$dl" ] || head -c 200 "$dl" | grep -qi "<!DOCTYPE\|<html"; then
            echo "::warning::URLhaus export failed (HTTP $code) - skipping."
            exit 0
          fi
          if unzip -tq "$dl" >/dev/null 2>&1; then unzip -p "$dl" > "$dl.txt" && mv "$dl.txt" "$dl"; fi
          python3 - "$dl" "$ws/various/urlhaus-hosts.txt" "${URLHAUS_ONLY_ONLINE}" <<'PY'
          import csv, re, sys
          from urllib.parse import urlparse
          src, out, only_online = sys.argv[1], sys.argv[2], sys.argv[3] == "1"
          ip = re.compile(r"^\d{1,3}(\.\d{1,3}){3}$")
          hosts = set()
          for line in open(src, errors="ignore"):
              line = line.strip()
              if not line or line.startswith("#"):
                  continue
              fields = next(csv.reader([line]), [])
              url = next((f for f in fields if re.match(r"^https?://", f, re.I)), None)
              if url:
                  status = next((f.lower() for f in fields if f.lower() in ("online", "offline")), "")
                  if only_online and status == "offline":
                      continue
                  h = (urlparse(url).hostname or "").lower()
              else:  # hosts format: "127.0.0.1<TAB>domain"
                  parts = line.split()
                  h = parts[1].lower() if len(parts) >= 2 and ip.match(parts[0]) else ""
              if h and not ip.match(h) and "." in h:
                  hosts.add(h)
          open(out, "w").write("\n".join(sorted(hosts)) + ("\n" if hosts else ""))
          print(f"URLhaus: {len(hosts)} unique hostnames (IPs excluded).")
          PY
          if [ -s "$ws/various/urlhaus-hosts.txt" ]; then
            cat "$ws/various/urlhaus-hosts.txt" >> "$ws/various/domains-extra.txt"
          fi

      # GithubInfosec/latest-malware-IoC: SOC-curated IOCs from recent
