name: Check Divest sources

# Manual run: reports which of the ~77 lists merged into Divested's domain blocklist
# are still reachable FROM A GITHUB RUNNER (the environment that matters for the CI).
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Check every source list
        run: python3 tools/check_divest_sources.py divest.zip
